SECTIONS.push({
  id: 'efcore',
  title: 'EF Core',
  kicker: 'Tracking, transactions, loading, LINQ',
  topics: [
    {
      id: 'ef-basics',
      title: 'Basics — DbContext and DbSet',
      html: `
        <p><b>Entity Framework:</b> an ORM which helps map C# objects to database tables.</p>
        <p><b>DbContext:</b> helps create a session between the application and the database server, track the changes and save data.</p>
        <p><b>DbSet:</b> represents a db table — <code>DbSet&lt;Employee&gt;</code>, where <code>Employee</code> is a C# class (model) and also a <b>db</b> table.</p>`
    },
    {
      id: 'ef-code-vs-db-first',
      title: 'Code First vs Database First',
      html: `
        <p><b>Code First:</b> we create C# models first, and EF creates or updates the database using migrations. Best suited for <b>new applications</b>.</p>
        <p><b>Database First:</b> the database schema already exists (or is created manually), and EF maps it to C# entities. Best suited for <b>existing or database-driven projects</b>.</p>
        <h4>Why did you use Database First in your project?</h4>
        <blockquote class="say"><p>Although the BIM Mapping table was new, it had to integrate with an existing database. We created the table using SQL scripts to have complete control over foreign keys, constraints, and naming conventions. After that, we mapped it in Entity Framework.</p></blockquote>
        <h4>Migrations</h4>
        <p>Migrations are just Entity Framework's way of applying schema changes. If EF manages the database, I use migrations. If the database schema is managed through SQL scripts or by DBAs, I update the schema directly in SQL and then update the EF model accordingly.</p>`
    },
    {
      id: 'ef-tracking-save',
      title: 'Change tracking and SaveChanges',
      html: `
        <p><b>Change tracking:</b> EF Core tracks the entities retrieved through DbContext. When <code>SaveChanges()</code> is called, it detects the modified entities and generates the required SQL.</p>
        <p><b>SaveChanges():</b> executes all pending INSERT, UPDATE, and DELETE operations in a transaction. This ensures atomicity — either all changes are committed successfully, or if any operation fails, the entire transaction is rolled back to keep the database consistent.</p>`
    },
    {
      id: 'ef-transactions',
      title: 'Transactions',
      html: `
        <p>Suppose you have a banking application. You do:</p>
        ${cb('csharp', `account1.Balance -= 1000;
account2.Balance += 1000;

context.SaveChanges();`)}
        <p>EF generates two SQL statements:</p>
        ${cb('sql', `UPDATE Account
SET Balance = Balance - 1000
WHERE Id = 1;

UPDATE Account
SET Balance = Balance + 1000
WHERE Id = 2;`)}
        <p>Now imagine this happens:</p>
        <ul>
          <li>First query succeeds</li>
          <li>Server crashes</li>
          <li>Second query never runs</li>
        </ul>
        <p>Now:</p>
        ${cb('text', `Account1 = ₹9000
Account2 = ₹5000`)}
        <p class="bad-line">₹1000 has disappeared.</p>
        <p>That's why EF wraps these statements in a <b>transaction</b>. Think of a transaction as:</p>
        <blockquote><p><b>"Either execute all SQL statements successfully, or execute none of them."</b></p></blockquote>
        <p>Internally, it's like:</p>
        ${cb('sql', `BEGIN TRANSACTION

UPDATE Account...

UPDATE Account...

COMMIT`)}
        <p>If something fails:</p>
        ${cb('sql', `ROLLBACK`)}
        <p>Database goes back to the original state.</p>
        <h4>Does EF always use a transaction?</h4>
        <p><b>Yes</b>, by default a single call to:</p>
        ${cb('csharp', `context.SaveChanges();`)}
        <p>is wrapped in a transaction <b>if multiple database changes need to be persisted</b>. If any command fails, EF rolls back the transaction so you don't end up with partially applied changes.</p>`
    },
    {
      id: 'ef-find-vs-first',
      title: 'Find() vs FirstOrDefault()',
      html: `
        <p><b>Find():</b> searches by primary key and checks the DbContext cache first.</p>
        <p><b>FirstOrDefault():</b> searches using any condition and queries the database.</p>`
    },
    {
      id: 'ef-asnotracking',
      title: 'AsNoTracking()',
      html: `
        <p><b>AsNoTracking():</b> helps disable change tracking, which makes read-only queries faster as no changes are being tracked by the EF DbContext. By default, EF Core always tracks changes.</p>
        <p>When you use AsNoTracking, i.e.</p>
        ${cb('csharp', `var emp = context.Employees
                 .AsNoTracking()
                 .First(e => e.Id == 1);

emp.Name = "Akshay";

context.SaveChanges();`)}
        <p>EF Core will not save the changes, as it doesn't know what has changed.</p>`
    },
    {
      id: 'ef-iqueryable',
      title: 'IQueryable vs IEnumerable in EF',
      html: `
        <p>I use <b>IQueryable</b> when querying the database because filtering, sorting, and pagination are executed in SQL, improving performance. I use <b>IEnumerable</b> after the data has been loaded into memory, especially when applying C# logic that cannot be translated into SQL.</p>
        <h4>Easy way to remember</h4>
        <ul>
          <li><code>IQueryable</code> = query is still being built.</li>
          <li><code>ToList()</code> = execute the query.</li>
          <li><code>List&lt;T&gt;</code> / <code>IEnumerable</code> = data is now in memory.</li>
        </ul>
        <p class="xref">Deeper version with the expression-tree detail: <a href="#csharp/csharp-list-ienumerable-iqueryable">List vs IEnumerable vs IQueryable</a></p>`
    },
    {
      id: 'ef-loading',
      title: 'Eager vs lazy loading',
      html: `
        <p><b>Eager loading:</b> I'm opening an Employee Details page, and I already know I'll need the Employee <b>and</b> the Department. I know I'll need the related data, so fetch everything in one database call.</p>
        <p><b>Lazy loading:</b> I'm opening an Employee List page. Right now I only need employee names. If the user later clicks an employee, then I'll need the Department. Don't fetch the related data now — fetch it only when I actually access it.</p>
        <h4>Why is lazy loading often discouraged?</h4>
        <p>Imagine 100 employees.</p>
        ${cb('csharp', `foreach (var emp in employees)
{
    Console.WriteLine(emp.Department.Name);
}`)}
        <p>EF may execute:</p>
        <ul>
          <li>1 query for Employees</li>
          <li>100 more queries for Departments</li>
        </ul>
        <p>Total = <b>101 queries</b> (the N+1 problem).</p>
        <p>With eager loading:</p>
        ${cb('csharp', `context.Employees
       .Include(e => e.Department)
       .ToList();`)}
        <p>Only <b>1 query</b>.</p>`
    },
    {
      id: 'ef-linq',
      title: 'LINQ — expected to write the code',
      html: `
        <ul>
          <li><b>Where</b> → which rows do I want?</li>
          <li><b>Select</b> → which columns do I want?</li>
        </ul>
        <h4>Questions</h4>
        <ol>
          <li>Return all employees whose Salary &gt; 50,000 and Department = "IT", sorted by Salary (highest to lowest).</li>
          <li>Return only the Name and Email of all employees.</li>
          <li>Return the top 5 highest-paid employees.</li>
          <li>Group employees by Department and return the Department Name and Employee Count.</li>
          <li>Join Employees and Departments and return the Employee Name and Department Name.</li>
        </ol>
        <h4>Answers</h4>
        ${cb('csharp', `employees.Select(e => new { e.Name, e.Email });

employees.Where(e => e.Salary > 50000 && e.Department == "IT")
         .OrderByDescending(e => e.Salary);

employees.OrderByDescending(e => e.Salary).Take(5);

employees.GroupBy(e => e.Department)
         .Select(g => new { Department = g.Key, Count = g.Count() });

employees.Join(departments,
               e => e.DepartmentId,
               d => d.Id,
               (e, d) => new { EmployeeName = e.Name, DepartmentName = d.Name });`)}`
    }
  ]
});

SECTIONS.push({
  id: 'sql',
  title: 'SQL & RDBMS',
  kicker: 'Indexes, joins, concurrency, ACID',
  topics: [
    {
      id: 'sql-temp-tables',
      title: 'Temp tables and table variables',
      html: `
        <p><b>Temp table:</b> a temporary table which is used to store interim data for the current session. Store it and use it rather than creating the same query again.</p>
        <p class="tags">#large data · #complex ops · #CREATE TABLE #Temp</p>
        <p><b>Table variable:</b> also stores temporary data, but for small size.</p>
        <p class="tags">#small data · #simple joins · #DECLARE @Table</p>
        <p class="fix">Fixed: the two syntax tags were swapped in your notes. <code>CREATE TABLE #Temp</code> makes a temp table, <code>DECLARE @Table</code> makes a table variable.</p>`
    },
    {
      id: 'sql-fk-unique',
      title: 'Foreign key vs unique key for uniqueness',
      html: `
        <p>If both foreign key and unique key columns are NOT NULL, which is better to use for uniqueness?</p>
        <p>A FK ensures referential integrity by making sure that the value exists in the parent table. A UNIQUE constraint is the one that makes sure no duplicate values exist in a column. So a FK does not give you uniqueness at all — many rows can point at the same parent. If the requirement is only to enforce uniqueness, I would use a UNIQUE constraint.</p>
        <p class="fix">Fixed: your note said "PK is mainly to ensure no dup values" mid-answer, but the question is FK vs UNIQUE. Swapped PK for UNIQUE so the answer holds together.</p>`
    },
    {
      id: 'sql-procs-indexes',
      title: 'Stored procedures, indexes, functions',
      html: `
        <h4>Stored procedure</h4>
        <p>A sort of function/method in SQL where we store pre-compiled sets of SQL statements which act like a function.</p>
        ${cb('sql', `CREATE PROCEDURE GetEmployees
AS
BEGIN
    SELECT * FROM Employee;
END;`)}
        <p>Execute:</p>
        ${cb('sql', `EXEC GetEmployees;`)}
        <h4>Indexes</h4>
        <p>A sort of data structure which is used to scan the row faster, majorly in O(log n) time using binary search. We use it at WHERE, JOIN, etc. as these are mostly filters. But it makes insert, update etc. slower because the index also needs to be updated.</p>
        ${cb('sql', `Create index ind-email
On Employee(Email)`)}
        <p><b>Clustered index:</b> physically sorts the table data based on the indexed column. A table can have only one clustered index.</p>
        <p><b>Non-clustered index:</b> creates a new lookup which stores the indexed value along with a pointer to it. The physical table doesn't change.</p>
        <h4>Composite index</h4>
        <p>Example:</p>
        ${cb('sql', `WHERE ProjectId=?
AND Status=?`)}
        <p>Instead of <code>Index(ProjectId)</code> and <code>Index(Status)</code>, create <code>(ProjectId, Status)</code>.</p>`
    },
    {
      id: 'sql-cte',
      title: 'CTE vs window functions',
      html: `
        <p><b>Functions:</b> SQL functions are a sort of reusable database object, which takes input parameters and has to return something. Stored permanently in the DB.</p>
        <p><b>CTE:</b> a sort of temporary table created for the current query. It helps avoid creating complex queries. It disappears upon query execution, i.e. <code>WITH RankedEmployees AS (query)</code> then use just <code>FROM RankedEmployees</code> and apply the rest of your logic.</p>
        <p class="fix">Added: the heading says window functions but your notes never covered them, and that is the usual follow-up.</p>
        <h4>Window function</h4>
        <p>It does a calculation across a set of rows but still gives you back every row. A normal GROUP BY squashes rows into one; a window function keeps them.</p>
        ${cb('sql', `SELECT Name, Department, Salary,
       ROW_NUMBER() OVER (PARTITION BY Department ORDER BY Salary DESC) AS rn

      html: `
        <h4>Two users try to purchase the last item simultaneously. How would you handle it?</h4>
        <p class="intent">Interviewer's intent: can you handle concurrent updates without causing data inconsistency?</p>
        <p>This is a classic concurrency problem. If both users read the item as available before either updates it, both purchases may succeed, resulting in overselling.</p>
        <p>To prevent this, I would use <b>optimistic locking</b> or <b>pessimistic locking</b>, depending on the business requirement.</p>
        <h4>Optimistic locking</h4>
        <p>Best when write conflicts are <b>rare</b>.</p>
        <p>In optimistic locking, I first read the record from the database along with its row version (or timestamp). I don't lock the record while making changes. When I update the record, I include the original row version in the WHERE clause. If the row version in the database is still the same, the update succeeds and the database generates a new row version. If the row version has changed because someone else updated the record, the UPDATE affects 0 rows, which tells me there's a concurrency conflict. Then I can ask the user to refresh the data or retry the operation.</p>
        <p>Uses a <b>RowVersion/Timestamp</b> column.</p>
        ${cb('text', `User A reads Product (Version = 5)
  → User B reads Product (Version = 5)

  → User B tries updating Version 5
  → Update fails
  → User B refreshes and retries`)}
        <p><b>Advantages:</b> better scalability, no database locks, higher throughput.<br>
           <b>Disadvantages:</b> failed updates must be retried.</p>
        <h4>Pessimistic locking</h4>
        <p>Best when conflicts are <b>frequent</b>.</p>
        ${cb('text', `User A locks the row
  → User B waits
  → User A commits
  → Lock released
  → User B proceeds`)}
        <p><b>Advantages:</b> prevents conflicting updates.<br>
           <b>Disadvantages:</b> blocking, lower concurrency, deadlocks possible.</p>
        <h4>Which locking strategy would you choose?</h4>
        <p><b>It depends on the contention level.</b></p>
        <ul>
          <li>If concurrent updates to the same record are <b>rare</b>, I'd choose <b>optimistic locking</b> because it scales better and avoids unnecessary locks.</li>
          <li>If concurrent updates are <b>frequent</b> or conflicts are <b>costly</b> (e.g. booking the last seat, limited inventory, banking), I'd choose <b>pessimistic locking</b> to prevent conflicting updates.</li>

        <h4>What is a deadlock?</h4>
        <p>A deadlock occurs when two transactions each hold a resource that the other transaction needs, causing both to wait indefinitely.</p>

Transaction B: Lock Payments → Waiting for Orders`)}
        <p>Neither transaction can continue.</p>
        <h4>How do you prevent deadlocks?</h4>
        <ul>
          <li>Keep transactions short.</li>
          <li>Always acquire locks in the same order.</li>
          <li>Use optimistic locking where appropriate.</li>
          <li>Lock only what you need.</li>
          <li>Retry failed transactions if deadlocks occur.</li>
        </ul>`

    {
      id: 'sql-acid',
      title: 'ACID properties',
      html: `
        <p><b>Atomicity:</b> all or nothing. It ensures a transaction happens fully or not at all. E.g. a bank transaction has to be atomic.</p>
        <p><b>Consistency:</b> the database should remain in the same state before or after a transaction. A transaction should also follow the predefined rules such as constraints, PK and FK. These constraints ensure that no matter what operations you perform, certain rules are supposed to be followed. You can't accidentally create an account with negative balance or invalid account type.</p>
        <p><b>Isolation:</b> transactions should execute independently. Transaction A should not see or be affected by the uncommitted changes made by Transaction B, because Transaction B may eventually commit or roll back. The database ensures that concurrent transactions don't interfere with each other.</p>
        <p><b>Durability:</b> once changes are committed they should be saved/stored permanently and won't be lost, even if the database server crashes or loses power immediately afterward.</p>`
    },

      title: 'Isolation levels',
      html: `
        <h4>Read Uncommitted</h4>
        <ul><li>DB allows reading uncommitted data from other transactions (dirty reads are possible)</li></ul>
        <h4>Read Committed</h4>
        <ul><li>Prevents dirty reads. It means the DB only allows reading committed data.</li></ul>
        <p class="fix">Added: your notes stop after two. There are four, and they ask for all of them.</p>
        <h4>Repeatable Read</h4>
        <ul>
          <li>If you read the same row twice in one transaction, you get the same value both times.</li>
          <li>Stops dirty reads and non-repeatable reads.</li>
          <li>Still allows phantom reads — new rows can appear that match your WHERE.</li>
        </ul>
        <h4>Serializable</h4>
        <ul>
          <li>Strictest. Transactions behave as if they ran one after another.</li>
          <li>Stops dirty reads, non-repeatable reads and phantoms.</li>
          <li>Slowest — most locking, lowest concurrency.</li>
        </ul>
        <h4>Quick table</h4>
        <table>
          <thead><tr><th>Level</th><th>Dirty read</th><th>Non-repeatable read</th><th>Phantom</th></tr></thead>
          <tbody>

            <tr><td>Repeatable Read</td><td>No</td><td>No</td><td>Possible</td></tr>
            <tr><td>Serializable</td><td>No</td><td>No</td><td>No</td></tr>
          </tbody>
        </table>`
    }

      id: 'obs-serilog-setup',
      title: 'Production logging in .NET on IIS — Serilog setup',
      html: `
        <p>For a .NET Web API running on Windows Server and IIS, we use Serilog to capture structured JSON events and format our log templates. But instead of hosting an on-premise logging server like Seq, we route those logs securely out to Azure Application Insights over standard HTTPS without blocking web request threads.</p>
        <h4>Configure Serilog — two-stage initialization</h4>
        <p>IIS has a fatal flaw: if your app crashes before dependency injection builds, the app pool silently dies and returns an HTTP 500.30 error. To prevent flying blind, a bootstrap logger writes to the local disk immediately, then hands control over to the main Serilog configuration once the app is running.</p>
        ${cb('csharp', `using Serilog;
using System.Diagnostics;
using Microsoft.ApplicationInsights.Extensibility;

// Stage 1: The disk-only bootstrap logger to catch IIS boot crashes
Log.Logger = new LoggerConfiguration()
    .WriteTo.File(@"D:\\Logs\\OrderService\\bootstrap-.txt", rollingInterval: RollingInterval.Day)
    .CreateBootstrapLogger();

try
{
    var builder = WebApplication.CreateBuilder(args);

    // 1a. Turn on Application Insights native telemetry tracking
    builder.Services.AddApplicationInsightsTelemetry();

    // 1b. Stamp this independent service with its name tag so it's
    //     identifiable in the central bucket
    builder.Services.AddSingleton<ITelemetryInitializer>(new
        CloudRoleNameTelemetryInitializer("OrderAPI"));

    // Stage 2: Hook Serilog into appsettings and route into the
    //          Application Insights pipeline
    builder.Host.UseSerilog((ctx, services, lc) => lc
        .ReadFrom.Configuration(ctx.Configuration)
        .WriteTo.ApplicationInsights(
            services.GetRequiredService<TelemetryConfiguration>(),
            TelemetryConverter.Traces));

    builder.Services.AddControllers();
    builder.Services.AddHttpClient(); // Auto-propagates W3C trace headers downstream

    var app = builder.Build();
    app.MapControllers();
    app.Run();
}
catch (Exception ex)
{
    Log.Fatal(ex, "App pool died during startup.");
}
finally
{
    Log.CloseAndFlush();
}`)}`

      html: `
        <p class="tagline">The name tag</p>
        <p>Every microservice running on IIS runs inside its own isolated <code>w3wp.exe</code> worker process. OrderService, PaymentService, and InventoryService know nothing about each other.</p>
        <p>To centralize them:</p>
        <ol>
          <li><b>The shared destination:</b> every single microservice gets configured with the exact same Azure Connection String. They all POST their telemetry to the same Log Analytics Workspace.</li>
          <li><b>The origin name tag (Cloud.RoleName):</b> because all logs land in the same database bucket, every service must stamp its logs before they leave the IIS server using an <code>ITelemetryInitializer</code>.</li>
        </ol>
        ${cb('csharp', `using Microsoft.ApplicationInsights.Channel;
using Microsoft.ApplicationInsights.Extensibility;

public class CloudRoleNameTelemetryInitializer : ITelemetryInitializer
{
    private readonly string _roleName;

    public CloudRoleNameTelemetryInitializer(string roleName) => _roleName = roleName;

    public void Initialize(ITelemetry telemetry)
    {
        // Stamps "OrderAPI", "PaymentAPI", etc. as the origin on every
        // outgoing log and trace
        telemetry.Context.Cloud.RoleName = _roleName;
    }
}`)}

        <p>Application Insights integrates directly with .NET's native Activity API. You don't need custom middleware to capture W3C tracing.</p>

      id: 'obs-metrics',
      title: 'Seeing metrics in Application Insights',
      html: `
        <p>Because you added <code>builder.Services.AddApplicationInsightsTelemetry()</code> to your .NET code, you no longer need to RDP into Windows Servers or set up PerfMon Data Collector Sets. That single line of code automatically spawns a background thread in your IIS worker process that scrapes server CPU, RAM, HTTP request rates, and dependency response times, and pushes them to Azure.</p>
        <p>Here is exactly where you go in the Azure Portal to analyze the health of your production APIs.</p>
        <h4>1. Live Metrics — the "right now" view</h4>
        <p>When a deployment just went out, or a customer calls saying "the system is down," you don't want to wait 3-5 minutes for logs to index. You open the Live Metrics blade in Application Insights.</p>
        <ul>
          <li><b>What it is:</b> a near real-time stream (1-second latency) directly from your IIS servers.</li>
          <li><b>What you see:</b> live line charts of incoming Requests/sec, outgoing Dependencies/sec (SQL calls), and the exact CPU and Memory footprint of the <code>w3wp.exe</code> process.</li>
          <li><b>The troubleshooting angle:</b> if the site starts choking, Live Metrics lets you instantly see if the bottleneck is CPU exhaustion on the IIS host, or if a downstream SQL database suddenly started taking 5 seconds to respond.</li>
        </ul>
        <h4>2. The Application Map — the architecture view</h4>
        <p>Because we stamped every IIS app pool with an <code>ITelemetryInitializer</code> (e.g. <code>Cloud.RoleName = "OrderAPI"</code>), Azure automatically draws a live topology map of your microservices.</p>
        <ul>
          <li><b>What you see:</b> a visual web of nodes. You literally see a circle labeled OrderAPI with an arrow pointing to PaymentAPI, and another arrow pointing to your SQL Database.</li>
          <li><b>How to use it:</b> the arrows show the average network latency and error rate between services. If the line between PaymentAPI and the Database turns red, you click the line, and Azure immediately reveals the exact slow SQL queries causing the traffic jam.</li>
        </ul>
        <h4>3. Performance &amp; Failures blades — the daily check-in</h4>
        <p>These two built-in dashboards are where you do your daily triage. You don't have to write queries; Azure pre-aggregates the telemetry.</p>
        <ul>
          <li><b>Performance blade:</b> you never look at "Average" response times (they lie). You look here to see the P50, P95, and P99 response times for every single API endpoint (e.g. <code>POST /api/orders</code>). If the P99 is 4 seconds, you click on it, and Azure gives you an end-to-end transaction waterfall showing exactly which method or database call took 3.8 seconds.</li>
          <li><b>Failures blade:</b> this groups your HTTP 500 errors by exception type (e.g. <code>SqlTimeoutException</code>, <code>NullReferenceException</code>). You click the exception, and it jumps straight to the exact line of C# code and the stack trace that crashed.</li>

        <h4>5. KQL — deep dive metric analytics</h4>
        <p>If the UI dashboards don't give you enough granularity, you drop into the Logs blade and write raw Kusto queries against the metric tables.</p>
        <p>To find CPU spikes across your IIS servers:</p>

        <p>First, I'd identify where the delay is coming from. I'd check whether the slowdown is happening on the client/network side, at the API itself, or in one of its dependencies.</p>
        <p>I'd look at things like request and response payload size, network latency, connection issues, CPU/memory, thread or connection-pool exhaustion, and whether the API is receiving an unusual amount of traffic.</p>
        <p>Then, for a slow request, I'd use its Trace ID and follow it through the system to see where the time is actually being spent.</p>
        <p>I'd check the individual spans to determine whether the delay is in our application code, another microservice, a database, or an external service.</p>
        <p>Based on where the delay is, I'd investigate that area further. For example, a large payload or network issue points me toward network/serialization, while a slow database span points me toward the query, indexes, locks, connection pool, and database health.</p>
        <p>Finally, after fixing the root cause, I'd verify that the API response time has returned to normal.</p>`

      id: 'obs-percentiles',
      title: 'P50 / P95 / P99',
      html: `
        <p>Suppose during one hour your API receives 10,000 requests. You take the response time of every request and arrange them from fastest to slowest.</p>
        <h4>P50</h4>
        <p>P50 is the median. The P50 latency is the point where about 50% of requests are at or below that latency and 50% are above it.</p>
        <p>Example: <b>P50 = 200 ms</b> means roughly half of the requests took 200 ms or less, and roughly half took 200 ms or more.</p>
        <p>So P50 gives you a picture of the typical request latency.</p>
        <h4>P95</h4>
        <p>P95 is the 95th percentile. The P95 latency is the point below which 95% of requests fall.</p>
        <p>Example: <b>P95 = 600 ms</b> means 95% of requests completed in 600 ms or less, while the slowest 5% took longer than 600 ms.</p>
        <h4>P99</h4>
        <p>P99 is the 99th percentile.</p>
        <p>Example: <b>P99 = 2 seconds</b> means 99% of requests completed in 2 seconds or less, while the slowest 1% took longer than 2 seconds.</p>
        <h4>Why do we look at all three?</h4>
        <p>Suppose you see:</p>
        ${cb('text', `P50 = 200 ms
P95 = 600 ms
P99 = 2 sec`)}
        <p>This tells you something important about the distribution:</p>
        <ul>
          <li>50% of requests ≤ 200 ms</li>
          <li>95% of requests ≤ 600 ms</li>
          <li>99% of requests ≤ 2 sec</li>
        </ul>
        <p>So the typical request is reasonably fast, but there is a long tail of slower requests. Percentiles are useful precisely because an average can hide that tail.</p>`

        <p><b>SLI</b> (Service Level Indicator) = the actual measure of how well the service is performing.</p>
        <p><b>SLO</b> (Service Level Objective) = the target we have decided that measure should meet.</p>
        <p>Google describes an SLI as a quantitative measure of a service characteristic such as latency, error rate, throughput, or availability. An SLO is the target or acceptable range for that SLI.</p>
        <h4>Example — success rate</h4>
        <p>For one of your APIs, for example:</p>
        ${cb('text', `SLI: Percentage of valid API requests that succeed
Actual measurement: 99.7% succeeded this month

SLO: 99.9% of valid API requests should succeed`)}
        <p>Now you can say: our SLI is 99.7%, while our SLO is 99.9%, so we're currently missing the target. That's the actual relationship.</p>
        <h4>Example — latency</h4>
        <p>Suppose the team cares about response time. You define the SLI as: percentage of API requests that complete within 500 ms. And set the SLO as: 99% of requests should complete within 500 ms over the agreed measurement window.</p>
        <p>Now imagine the measured result is:</p>
        ${cb('text', `SLI = 98.5%
SLO = 99%`)}
        <p>The service is not meeting its SLO.</p>

   ┌──────────────┐     ┌──────────────┐     ┌──────────────┐

                        └──────┬───────┘
                               ↓
                   ┌───────────────────────┐
                   │ Application           │
                   │ Performance Mgmt (APM)│
                   └───────────────────────┘`)}
        <p class="fix">Added: the source page had this as a diagram only. The definitions below are mine, to go with it.</p>
        <ul>
          <li><b>Logging</b> — the raw records of what happened. One line per event.</li>
          <li><b>Metrics</b> — numbers over time. CPU, memory, requests/sec, latency.</li>
          <li><b>Monitoring</b> — watching known signals against known thresholds. Answers "is it up, is it within limits".</li>
          <li><b>Alerting</b> — telling a human when a monitored signal crosses a line.</li>
          <li><b>APM</b> — application-level performance: which endpoint, which method, which query is slow.</li>
          <li><b>Observability</b> — the umbrella over all of it. Whether you can answer a question you did not plan for, from the telemetry you already collect.</li>
        </ul>
        <p>The short version: monitoring tells you <i>that</i> something broke. Observability is what lets you work out <i>why</i>.</p>`

roadmap: `
  <p>This is the map, not the material. It lists everything that comes up for a senior .NET role, grouped by area, then ranks it into three tiers.</p>
  <p>Read the tiers first. Tier 1 is what gets asked in the first twenty minutes of nearly every interview — C#, ASP.NET Core, REST, DI, EF Core. Tier 3 is what gets asked if there is time left.</p>`,

rest: `
  <p><b>REST</b> (Representational State Transfer) is a style for building APIs over HTTP. You expose <b>resources</b> (a flight, a user, an order) at URLs, and you act on them using standard HTTP methods. There is no REST library — it is a set of conventions.</p>
  <h4>The rules that matter</h4>
  <ul>
    <li><b>Resources, not actions</b> — <code>/api/flights/123</code>, not <code>/api/getFlight?id=123</code>. Nouns in the URL, the verb is the HTTP method.</li>
    <li><b>Stateless</b> — every request carries everything the server needs. The server keeps no memory of your last call. That is what lets you run 100 instances behind a load balancer.</li>
    <li><b>Uniform interface</b> — same methods, same status codes, same shapes, everywhere.</li>
  </ul>
  <h4>The methods</h4>
  <table>
    <thead><tr><th>Method</th><th>Does</th><th>Safe</th><th>Idempotent</th></tr></thead>
    <tbody>
      <tr><td>GET</td><td>Read</td><td>Yes</td><td>Yes</td></tr>
      <tr><td>POST</td><td>Create / run something</td><td>No</td><td>No</td></tr>
      <tr><td>PUT</td><td>Replace the whole resource</td><td>No</td><td>Yes</td></tr>
      <tr><td>PATCH</td><td>Update part of it</td><td>No</td><td>No</td></tr>
      <tr><td>DELETE</td><td>Remove it</td><td>No</td><td>Yes</td></tr>
    </tbody>
  </table>
  <p><b>Safe</b> = does not change anything. <b>Idempotent</b> = calling it five times leaves the same result as calling it once. This is the pair they probe when they ask "why GET".</p>
  <h4>Status codes you should say out loud</h4>
  <p>200 OK · 201 Created · 204 No Content · 400 Bad Request · 401 Unauthorized (who are you) · 403 Forbidden (I know who you are, you still can't) · 404 Not Found · 409 Conflict · 429 Too Many Requests · 500 Server Error · 504 Gateway Timeout.</p>
  <h4>When REST, when not</h4>
  <p>REST for public APIs and normal CRUD. <b>gRPC</b> for fast internal service-to-service calls. <b>GraphQL</b> when clients need to pick their own fields and you are tired of building one endpoint per screen.</p>
  <p>Everything below builds one real endpoint — a search API — all the way from URL design to ElasticSearch and versioning.</p>`,

aspnet: `
  <p><b>ASP.NET Core</b> is Microsoft's cross-platform framework for building web APIs and apps on .NET. It runs on Windows, Linux and containers, and everything is configured in code in <code>Program.cs</code> — no more web.config.</p>
  <h4>How a request travels</h4>
  <p>A request arrives at the web server (Kestrel), then passes through the <b>middleware pipeline</b> — a chain of small components each doing one job — and finally reaches your endpoint. Then the response walks back out through the same chain in reverse.</p>
  <h4>Two ways to write an endpoint</h4>
  <ul>
    <li><b>Controller-based</b> — a class with <code>[HttpGet]</code> methods. Standard for anything non-trivial.</li>
    <li><b>Minimal APIs</b> — <code>app.MapGet("/ping", () =&gt; "ok")</code> straight in Program.cs. Good for small services.</li>
  </ul>
  <h4>What the framework gives you</h4>
  <p>A built-in DI container, configuration from appsettings and environment variables, logging, model binding and validation, and the auth pipeline. You register services at startup, then ask for them in a constructor — the framework builds the object graph for you.</p>
  <p>The topics below cover the three things interviewers dig into: the pipeline and its ordering, DI and lifetimes, and staying safe when many requests hit the same service at once.</p>`,

csharp: `
  <p>C# runs on the <b>CLR</b> — a managed runtime. You do not free memory yourself; the garbage collector does. That is the deal, and it is also where the questions come from: what the runtime handles for you, and what it quietly does not.</p>
  <h4>Where things live</h4>
  <p><b>Value types</b> (int, bool, struct) usually sit on the stack and are copied when assigned. <b>Reference types</b> (class, string, arrays) live on the managed heap and you pass a reference to them. The GC only manages that heap.</p>
  <h4>The three gaps to know</h4>
  <ul>
    <li><b>Memory versus resources</b> — GC frees memory. It does not reliably close files, sockets or DB connections. That is what <code>IDisposable</code> is for.</li>
    <li><b>Queries versus data</b> — an <code>IQueryable</code> is a query you are still building. A <code>List</code> is data already in memory. Confusing the two is how you accidentally load a whole table.</li>
    <li><b>Concurrency versus parallelism</b> — many things in flight versus many things literally running at once. One core can only do the first.</li>
  </ul>
  <p>Each of those has its own topic below.</p>`,

security: `
  <p>Two words that get mixed up constantly:</p>
  <ul>
    <li><b>Authentication</b> — who are you? Proven by a token or credentials. Fails with <b>401</b>.</li>
    <li><b>Authorization</b> — you are in, but are you allowed to do <i>this</i>? Fails with <b>403</b>.</li>
  </ul>
  <p>Authentication always runs first. That single fact explains the middleware ordering rule later in this section.</p>
  <h4>The three names</h4>
  <ul>
    <li><b>OAuth 2.0</b> — a framework for <i>delegated authorization</i>. It hands an app a token to act on a user's behalf, so the app never sees the password.</li>
    <li><b>OpenID Connect (OIDC)</b> — a thin layer on top of OAuth that adds identity, via the <code>id_token</code>. OAuth says what you may do; OIDC says who you are.</li>
    <li><b>JWT</b> — the token format itself. Signed, not encrypted, and readable by anyone who has it.</li>
  </ul>
  <h4>Why tokens instead of sessions</h4>
  <p>A session means the server remembers you, so every instance needs access to that memory. A signed token means the server can verify you with maths alone — no shared store, no database call. That is what makes it scale, and it is also why you cannot cancel one early.</p>
  <p>The topics below go from the shape of the token to exactly what runs on every request in .NET.</p>`,

patterns: `
  <p>Design patterns are named solutions to problems that keep recurring. They are a shared vocabulary — saying "that's a Factory" saves five minutes of explanation. They are not rules, and forcing one where it does not fit makes code worse.</p>
  <h4>Three families</h4>
  <ul>
    <li><b>Creational</b> — about making objects. Factory, Builder, Singleton.</li>
    <li><b>Structural</b> — about composing them. Facade, Decorator, Adapter.</li>
    <li><b>Behavioural</b> — about how they interact. Strategy, Observer, Command.</li>
  </ul>
  <p>Interviewers rarely want a textbook definition. They want to hear you pick one for a scenario and justify it — which is exactly what the first topic below is about.</p>`,

microservices: `
  <p>A <b>microservice</b> architecture splits one application into several small services, each owning its own job and usually its own database, talking over the network.</p>
  <h4>What you get, and what it costs</h4>
  <p>You get independent deploys, independent scaling, and teams that do not block each other. You pay for it with network calls that fail, data spread across services, and far harder debugging. A monolith is still the right answer for a small team — say that out loud, it shows judgement.</p>
  <h4>The four questions that always follow</h4>
  <ul>
    <li><b>How do services talk?</b> Sync (REST, gRPC) or async (Kafka, RabbitMQ).</li>
    <li><b>What happens when one is down?</b> Timeout, retry, circuit breaker.</li>
    <li><b>How do they find each other?</b> Service discovery, not hardcoded URLs.</li>
    <li><b>How do you keep data consistent?</b> Eventual consistency and the saga pattern, since you cannot hold one transaction across services.</li>
  </ul>
  <p>Every topic below answers one of those.</p>`,

deploy: `
  <p>Deployment is getting your built code onto a machine that serves traffic, repeatably, and being able to undo it. The pipeline everyone is describing is the same one every time:</p>
  <p><code>Code → Build → Test → Artifact/Image → Deploy → Monitor → Rollback</code></p>
  <h4>The vocabulary</h4>
  <ul>
    <li><b>Artifact</b> — the built output you deploy. Same artifact promoted through dev, QA, prod. Never rebuild per environment.</li>
    <li><b>Container</b> — your app plus its dependencies in one image, so it runs the same on your laptop and the server.</li>
    <li><b>Orchestrator</b> — Kubernetes or ECS, deciding where containers run, restarting them, scaling them.</li>
    <li><b>CI/CD</b> — CI builds and tests every push, CD ships it.</li>
    <li><b>Observability</b> — logs, metrics and traces. If you cannot see it, you cannot debug it at 2am.</li>
  </ul>
  <p>The last two topics here are about your own TFS and IIS setup, and how to talk about it honestly without sounding behind.</p>`,

efcore: `
  <p>An <b>ORM</b> (Object Relational Mapper) maps database tables to C# classes so you write LINQ instead of SQL strings. <b>EF Core</b> is Microsoft's, and it is the default in .NET.</p>
  <h4>The three pieces</h4>
  <ul>
    <li><b>Entity</b> — a C# class that maps to a table row.</li>
    <li><b>DbSet&lt;T&gt;</b> — the table itself, queryable.</li>
    <li><b>DbContext</b> — your session with the database. It holds the DbSets, tracks what changed, and writes it back.</li>
  </ul>
  <h4>How a save actually happens</h4>
  <p>You load entities, change properties in plain C#, and call <code>SaveChanges()</code>. EF compares what it handed you against what you have now, generates the INSERT/UPDATE/DELETE statements, and runs them in one transaction.</p>
  <h4>Where it goes wrong</h4>
  <p>Almost every EF performance question is one of three things: filtering in memory instead of in SQL, tracking entities you only meant to read, or firing one query per row instead of one query. All three have a topic below.</p>
  <p><b>Dapper</b> is the alternative — a micro ORM where you write the SQL yourself. Faster, but you lose change tracking and migrations.</p>`,

sql: `
  <p>A relational database stores data in <b>tables</b> of rows and columns, with relationships between them enforced by keys.</p>
  <h4>The building blocks</h4>
  <ul>
    <li><b>Primary key</b> — uniquely identifies a row.</li>
    <li><b>Foreign key</b> — points at a primary key in another table, and stops you pointing at something that does not exist.</li>
    <li><b>Unique constraint</b> — no duplicates in this column.</li>
    <li><b>Index</b> — a lookup structure that makes reads fast and writes a bit slower.</li>
    <li><b>Normalization</b> — splitting data so nothing is stored twice.</li>
  </ul>
  <h4>Two halves of SQL</h4>
  <p><b>DDL</b> shapes the database (CREATE, ALTER, DROP). <b>DML</b> moves data around (SELECT, INSERT, UPDATE, DELETE).</p>
  <h4>Where the real questions are</h4>
  <p>Anyone can write a join. The senior questions are all about what happens when two people touch the same row at the same moment — locking, deadlocks, transactions and isolation levels. That is the back half of this section, and it is worth more preparation than the front half.</p>`,

observability: `
  <p><b>Observability</b> is how much you can work out about what a running system is doing, just from the signals it already emits. Monitoring tells you <i>that</i> something is wrong. Observability is what lets you find out <i>why</i>, without shipping new code first.</p>
  <h4>The three signals</h4>
  <ul>
    <li><b>Logs</b> — one record per event. What happened, in words.</li>
    <li><b>Metrics</b> — numbers over time. CPU, memory, requests per second, latency.</li>
    <li><b>Traces</b> — one request followed across every service it touched, with timings.</li>
  </ul>
  <h4>Why traces matter in microservices</h4>
  <p>In a monolith, a stack trace tells you everything. Once the work is spread across five services on five machines, no single log file has the story. Each box only knows its own part. A <b>Trace ID</b> is the thread that stitches them together — it is generated at the edge, carried in the <code>traceparent</code> header to every downstream call, and stamped on every log line along the way. Search one ID, get the whole journey.</p>
  <h4>The vocabulary</h4>
  <ul>
    <li><b>Trace</b> — the whole request journey.</li>
    <li><b>Span</b> — one operation within it, with a start and a duration.</li>
    <li><b>W3C Trace Context</b> — the standard header format so different tools agree.</li>
    <li><b>Instrumentation</b> — the library that creates and forwards all this for you.</li>
    <li><b>Structured logging</b> — logging key/value pairs instead of a flat sentence, so it can be queried.</li>
  </ul>
  <p>The rest of this section is the real setup: Serilog into Azure Application Insights on Windows and IIS, how separate services land in one workspace, and what you actually open when the API gets slow.</p>`,

jscore: `
  <p>React sits on top of JavaScript, and most "React bugs" are really JavaScript behaviours. Interviewers know this, which is why they stop asking about hooks and start asking about closures.</p>
  <h4>The three that come up</h4>
  <ul>
    <li><b>Hoisting</b> — declarations are processed before the code runs, which is why a <code>var</code> can be read before its line (as <code>undefined</code>) while a <code>let</code> throws.</li>
    <li><b>Closures</b> — an inner function keeps hold of the variables it was created with, even after the outer function returned. This is what makes stale state bugs in React possible.</li>
    <li><b>The event loop</b> — JavaScript runs on one thread. Async callbacks wait in a queue and only run once the stack is empty, which is why <code>setTimeout(fn, 0)</code> is not immediate.</li>
  </ul>
  <p>Get these three and most of React's odd behaviour stops being odd.</p>`,

react: `
  <p><b>React</b> is a JavaScript library for building user interfaces out of <b>components</b> — small functions that take data in and return what the UI should look like.</p>
  <h4>The core idea</h4>
  <p>React is <b>declarative</b>. You do not tell the browser "find this div and change its text". You describe what the screen should look like for the current data, and React works out the minimum set of DOM changes to get there. That is what the virtual DOM is for.</p>
  <h4>The vocabulary</h4>
  <ul>
    <li><b>JSX</b> — HTML-looking syntax inside JavaScript. It compiles to plain function calls.</li>
    <li><b>Props</b> — data passed down from a parent. Read-only.</li>
    <li><b>State</b> — data a component owns. Changing it triggers a re-render.</li>
    <li><b>Hooks</b> — functions starting with <code>use</code> that let a function component hold state and side effects.</li>
    <li><b>Re-render</b> — React calls your component function again. It does not mean the DOM was rebuilt.</li>
  </ul>
  <h4>What they actually test</h4>
  <p>Not syntax. They test whether you understand <i>why</i> something re-renders, and the JavaScript underneath — closures, hoisting, the event loop. Those are in this section too.</p>`

const MOVE = {
  'aspnet-sessions-cookies'   : 'security',        // session vs token is an auth question
  'aspnet-solid-so'           : 'patterns',        // SOLID is OO design, not a framework feature
  'aspnet-thread-safety'      : 'csharp',          // concurrency belongs with the runtime
  'aspnet-timeout-thirdparty' : 'microservices',   // calling another service = resilience
  'dep-elk'                   : 'observability',   // centralised logging has its own section now

};
(function(){
  const byId = {}; SECTIONS.forEach(s=>byId[s.id]=s);
  Object.keys(MOVE).forEach(function(tid){
    const dest = byId[MOVE[tid]]; if(!dest) return;
    for(const s of SECTIONS){
      const i = s.topics.findIndex(t=>t.id===tid);
      if(i>=0){ dest.topics.push(s.topics.splice(i,1)[0]); break; }
    }
  });
  // introductions stay first in their section
  SECTIONS.forEach(function(s){
    const i = s.topics.findIndex(t=>t.isIntro);
    if(i>0) s.topics.unshift(s.topics.splice(i,1)[0]);
  });
})();

SECTIONS.forEach(function(s){
  const m=SECMETA[s.id]||{};
  s.art=m.art||'a1'; s.tier=m.tier||''; s.group=m.group||'Other';
  s.tagline=m.tagline||s.kicker; s.blurb=m.blurb||s.kicker; s.art2=ART[s.id]||'';
  if(SECINTRO[s.id]){
    s.topics.unshift({
      id:s.id+'-intro', title:'Introduction',
      blurb:'What this is, the vocabulary, and how the rest of the section fits together.',
      mins:3, html:SECINTRO[s.id], isIntro:true
    });
  }
  s.topics.forEach(function(t){
    const tm=TMETA[t.id]||[];
    if(tm.length){ t.blurb=tm[0]; t.mins=tm[1]; }
    t.sec=s; t.intro=t.isIntro?'':(TINTRO[t.id]||''); t.res=RES[t.id]||[];
  });
});
const ALL=[];
SECTIONS.forEach(s=>s.topics.forEach(t=>ALL.push(t)));
const BYID={}; ALL.forEach(t=>BYID[t.id]=t);
const SBYID={}; SECTIONS.forEach(s=>SBYID[s.id]=s);

function secDone(s){return s.topics.filter(t=>isRead(t.id)).length;}
function secPct(s){return Math.round(secDone(s)/s.topics.length*100);}
function allPct(){return Math.round(ALL.filter(t=>isRead(t.id)).length/ALL.length*100);}
function minsLeft(s){return s.topics.filter(t=>!isRead(t.id)).reduce((a,t)=>a+t.mins,0);}
function nextIn(s){return s.topics.find(t=>!isRead(t.id))||s.topics[0];}
function inProgress(){return SECTIONS.filter(s=>{const d=secDone(s);return d>0&&d<s.topics.length;});}
function topicIdx(t){return t.sec.topics.indexOf(t);}
function nextTopic(t){
  const i=topicIdx(t);
  if(i<t.sec.topics.length-1) return t.sec.topics[i+1];
  const si=SECTIONS.indexOf(t.sec);
  return si<SECTIONS.length-1?SECTIONS[si+1].topics[0]:null;
}
function pad(n){return n<10?'0'+n:''+n;}

  const prog=inProgress();

  let resumeSec=prog[0]||SECTIONS.find(s=>secDone(s)===0)||SECTIONS[0];

  const last=LS.get('nb.last','');
  if(last){

      '</div>'+
    '</div>'+
    '<button class="resume" data-go="t/'+resumeSec.id+'/'+resumeTopic.id+'">'+
      '<span class="rart '+resumeSec.art+'">'+(resumeSec.art2||'')+'</span>'+
      '<span class="rtx">'+
        '<em>'+(read?'Continue reading':'Start here')+'</em>'+
        '<b>'+esc(resumeTopic.title)+'</b>'+
        '<i>'+esc(resumeSec.title)+' · '+resumeTopic.mins+' min</i>'+
      '</span>'+
      '<span class="rgo">▶</span>'+
    '</button>'+
  '</div></section>';

  /* ---------- filter chips + section grid ---------- */
  h+='<section class="gridwrap">'+
     '<div class="grid-h"><h2>All sections</h2>'+
       '<em>'+SECTIONS.length+' sections · '+ALL.length+' topics</em>'+
       '<div class="filters">'+
         '<button class="fil on" data-filter="all">All</button>'+
         '<button class="fil" data-filter="doing">In progress</button>'+
         '<button class="fil" data-filter="todo">Not started</button>'+
         '<button class="fil" data-filter="done">Finished</button>'+
       '</div>'+
     '</div>';

  GROUPS.forEach(function(g){
    const secs=SECTIONS.filter(s=>s.group===g);

    h+='<div class="band'+(secs.length===1?' solo':'')+'" data-band="'+esc(g)+'">'+

/* ---- in-topic outline, built from the headings in your notes ---- */
function buildOutline(){
  const box=document.getElementById('outline'); if(!box) return;
  const hs=[...document.querySelectorAll('#sc-read .read h4')];
  if(hs.length<3){ box.innerHTML=''; return; }
  hs.forEach((el,i)=>el.id='h-'+i);
  box.innerHTML='<p class="lbl">ON THIS PAGE</p><ol class="ol-out">'+
    hs.map((el,i)=>'<li data-h="h-'+i+'"><button data-scrollto="h-'+i+'">'+esc(el.textContent)+'</button></li>').join('')+
    '</ol>';
  const items=[...box.querySelectorAll('li')];
  if(typeof IntersectionObserver==='undefined') return;
  const spy=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting) return;
      items.forEach(li=>li.classList.toggle('cur', li.dataset.h===e.target.id));
    });
  },{rootMargin:'-80px 0px -72% 0px'});
  hs.forEach(el=>spy.observe(el));
}

let _sticky=null;
function stickyBar(t,s,nx,read){
  const old=document.getElementById('sbar'); if(old) old.remove();
  const bar=document.createElement('div');
  bar.id='sbar'; bar.className='sbar';
  bar.innerHTML='<span class="st">'+esc(t.title)+'</span>'+
    '<span class="sb-act">'+
      '<button class="sb'+(read?' on':'')+'" data-read="'+t.id+'" title="Mark as read">✓</button>'+
      (nx?'<button class="sb next" data-go="t/'+nx.sec.id+'/'+nx.id+'">Next →</button>':'')+
    '</span>';
  document.body.appendChild(bar);
  _sticky=bar;
}

/* ---- reading progress ---- */
(function(){
  const line=document.createElement('div'); line.className='readline'; line.innerHTML='<i></i>';
  document.body.appendChild(line);
  const bar=line.firstChild;
  addEventListener('scroll',function(){
    const onRead=document.getElementById('sc-read').classList.contains('on');
    line.style.opacity=onRead?1:0;
    if(!onRead) return;
    const h=document.documentElement.scrollHeight-innerHeight;
    bar.style.width=(h>60?Math.min(100,(scrollY/h)*100):0)+'%';
    if(_sticky) _sticky.classList.toggle('on', scrollY>220);
  },{passive:true});
})();

  let h='<div class="page"><h1>Revision list</h1><p class="lede">'+
    (items.length? items.length+' flagged · ~'+items.reduce((a,t)=>a+t.mins,0)+' min'
                 : 'Nothing flagged yet')+'</p>';
  h+= items.length ? '<div class="eplist" style="padding:0">'+items.map(function(t,i){
        return epHTML(t,topicIdx(t));
      }).join('')+'</div>'
  : '<div class="empty"><b>Nothing flagged</b>Hit the flag on any topic and it lands here, so you can run through the weak ones before an interview.</div>';
  h+='</div>';
  document.getElementById('sc-page').innerHTML=h;
}

/* ============ routing ============ */
function screen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function setNav(k){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===k));
}
function route(){
  const raw=decodeURIComponent(location.hash.replace(/^#/,''))||'home';
  const p=raw.split('/');
  document.body.classList.toggle('on-land', raw==='home'||raw==='');
  if(raw==='home'||raw===''){ renderLanding(); screen('sc-land'); setNav(''); refreshRing(); window.scrollTo({top:0,behavior:'auto'}); document.getElementById('nav').classList.remove('open'); return; }
  if(p[0]==='t'&&p[2]){ renderRead(p[1],p[2]); screen('sc-read'); setNav(''); }
  else if(p[0]==='s'&&p[1]){ renderSection(p[1]); screen('sc-section'); setNav(p[1]==='roadmap'?'s/roadmap':''); }
  else if(raw==='notes'){ renderNotes(); screen('sc-page'); setNav('notes'); }
  else if(raw==='revise'){ renderRevise(); screen('sc-page'); setNav('revise'); }
  else { renderBrowse(); screen('sc-browse'); setNav('browse'); }
  refreshRing();
  window.scrollTo({top:0,behavior:'auto'});
  document.getElementById('nav').classList.remove('open');
}
addEventListener('hashchange',route);

/* ============ actions ============ */
function rerender(){ route(); }

document.addEventListener('click',function(e){
  const go=e.target.closest('[data-go]');
  if(go){ location.hash=go.dataset.go; return; }

  const nav=e.target.closest('[data-nav]');
  if(nav){ location.hash=nav.dataset.nav; return; }

  const sc=e.target.closest('[data-sc]');
  if(sc){
    const strip=document.getElementById(sc.dataset.sc);
    if(strip) strip.scrollBy({left:(+sc.dataset.d)*strip.clientWidth*0.85,behavior:'smooth'});
    return;
  }

  const sc2=e.target.closest('[data-scrollto]');
  if(sc2){
    const el=document.getElementById(sc2.dataset.scrollto);
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }

  const dn=e.target.closest('[data-readnext]');
  if(dn){ LS.set(rK(dn.dataset.readnext),'1'); location.hash=dn.dataset.next; return; }

  const fl2=e.target.closest('[data-filter]');
  if(fl2){
    const key=fl2.dataset.filter;
    document.querySelectorAll('.fil').forEach(b=>b.classList.toggle('on',b===fl2));
    document.querySelectorAll('.gtile').forEach(function(tl){
      tl.style.display=(key==='all'||tl.dataset.state===key)?'':'none';
    });
    document.querySelectorAll('.band').forEach(function(b){
      const any=[...b.querySelectorAll('.gtile')].some(t=>t.style.display!=='none');
      b.style.display=any?'':'none';
    });
    return;
  }

  const uf=e.target.closest('[data-unread]');
  if(uf){
    const on=uf.classList.toggle('on');
    uf.textContent=on?'Showing unread':'Show unread only';
    document.querySelectorAll('#sc-section .ep').forEach(function(ep){
      ep.style.display = (on && isRead(ep.dataset.ep)) ? 'none' : '';
    });
    return;
  }

  const rd=e.target.closest('[data-read]');
  if(rd){
    const id=rd.dataset.read;
    if(isRead(id)){ LS.del(rK(id)); toast('Marked unread'); }
    else { LS.set(rK(id),'1'); toast('Marked as read'); }
    rerender(); return;
  }

  const fl=e.target.closest('[data-flag]');
  if(fl){
    const id=fl.dataset.flag;
    if(isFlag(id)){ LS.del(fK(id)); toast('Removed from revision list'); }
    else { LS.set(fK(id),'1'); toast('Added to revision list'); }
    rerender(); return;
  }

  const ma=e.target.closest('[data-markall]');
  if(ma){ SBYID[ma.dataset.markall].topics.forEach(t=>LS.set(rK(t.id),'1')); toast('Section marked read'); rerender(); return; }

  const ca=e.target.closest('[data-clearall]');
  if(ca){ SBYID[ca.dataset.clearall].topics.forEach(t=>LS.del(rK(t.id))); toast('Section cleared'); rerender(); return; }

  const nt=e.target.closest('[data-notetoggle]');
  if(nt){
    const box=document.querySelector('[data-note="'+nt.dataset.notetoggle+'"]');
    box.classList.toggle('open');
    if(box.classList.contains('open')) box.querySelector('textarea').focus();
    return;
  }

  const cn=e.target.closest('[data-clearnote]');
  if(cn){ LS.del(nK(cn.dataset.clearnote)); toast('Note deleted'); rerender(); return; }

  const pk=e.target.closest('[data-peek]');
  if(pk){
    const id=pk.dataset.peek, row=document.querySelector('.ep[data-ep="'+id+'"]');
    const open=row.nextElementSibling&&row.nextElementSibling.classList.contains('epmore');
    document.querySelectorAll('.epmore').forEach(n=>n.remove());
    if(open){ pk.textContent='⌄'; return; }
    const t=BYID[id];
    const tmp=document.createElement('div'); tmp.innerHTML=t.html;
    const note=getNote(id);
    let txt='';
    const fp=tmp.querySelector('p:not(.fix):not(.tagline)');
    if(fp) txt=fp.textContent.trim();
    if(!txt){ const li=tmp.querySelector('li'); txt=li?li.textContent.trim():''; }
    const div=document.createElement('div');
    div.className='epmore';
    div.innerHTML=(note?'<span class="k">YOUR NOTE</span>'+esc(note)+'<br><br>':'')+
      '<span class="k">PREVIEW</span>'+esc(txt.slice(0,240))+(txt.length>240?'…':'');
    row.after(div);
    pk.textContent='⌃';
    return;
  }
});

document.addEventListener('input',function(e){
  const ta=e.target;
  if(ta.tagName!=='TEXTAREA') return;
  const box=ta.closest('[data-note]'); if(!box) return;
  const id=box.dataset.note, st=box.querySelector('[data-status]');
  st.textContent='Saving…';
  clearTimeout(box._t);
  box._t=setTimeout(function(){
    const v=ta.value.trim();
    if(v) LS.set(nK(id),v); else LS.del(nK(id));
    st.textContent=v?'Saved':'';
    const btn=document.querySelector('[data-notetoggle="'+id+'"]');
    if(btn) btn.classList.toggle('noteon',!!v);
  },400);
});

function wireCode(root){
  root.querySelectorAll('figure.code .cp').forEach(function(b){
    b.addEventListener('click',function(){
      const code=b.parentElement.querySelector('code').textContent;
      const fb=function(){
        const ta=document.createElement('textarea');
        ta.value=code; document.body.appendChild(ta); ta.select();
        try{document.execCommand('copy');}catch(e){}
        ta.remove();
      };
      try{
        if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code)['catch'](fb);
        else fb();
      }catch(e){ fb(); }
      b.textContent='Copied'; setTimeout(function(){b.textContent='Copy';},1400);
    });
  });
}

/* ============ search ============ */
const searchEl=document.getElementById('search'),sinput=document.getElementById('sinput'),sres=document.getElementById('sres');
let sel=0,hits=[];
const INDEX=ALL.map(function(t){
  const d=document.createElement('div'); d.innerHTML=t.html;
  return {t:t,text:(d.textContent||'').replace(/\s+/g,' ').trim()};
});
function openSearch(){ searchEl.classList.add('open'); sinput.value=''; sinput.focus(); runSearch(''); }
function closeSearch(){ searchEl.classList.remove('open'); }
function runSearch(q){
  q=q.trim();
  if(!q){ hits=[]; sres.innerHTML='<div class="sempty">Search titles and body text across all '+ALL.length+' topics.</div>'; return; }
  const n=q.toLowerCase();
  hits=INDEX.map(function(it){
    const ti=it.t.title.toLowerCase().indexOf(n);
    const bi=it.text.toLowerCase().indexOf(n);
    const bl=it.t.blurb.toLowerCase().indexOf(n);
    if(ti<0&&bi<0&&bl<0) return null;
    return {it:it,score:(ti>=0?0:(bl>=0?50:100))+(ti>=0?ti:(bl>=0?bl:bi)),bi:bi};
  }).filter(Boolean).sort((a,b)=>a.score-b.score).slice(0,25);
  if(!hits.length){ sres.innerHTML='<div class="sempty">Nothing matches “'+esc(q)+'”.</div>'; return; }
  sel=0;
  sres.innerHTML=hits.map(function(h,i){
    let snip='';
    if(h.bi>=0){
      const st=Math.max(0,h.bi-40);
      snip=(st>0?'…':'')+h.it.text.slice(st,st+130);
      snip=esc(snip).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
    } else snip=esc(h.it.t.blurb);
    return '<button data-i="'+i+'" class="'+(i===0?'sel':'')+'">'+
      '<div class="rs">'+esc(h.it.t.sec.title.toUpperCase())+'</div>'+
      '<div class="rt">'+esc(h.it.t.title)+'</div>'+
      '<div class="rx">'+snip+'</div></button>';
  }).join('');
  sres.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.i)));
}
function pick(i){ const h=hits[i]; if(!h) return; closeSearch(); location.hash='t/'+h.it.t.sec.id+'/'+h.it.t.id; }
function moveSel(d){
  if(!hits.length) return;
  sel=(sel+d+hits.length)%hits.length;
  sres.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('sel',i===sel));
  const c=sres.querySelector('button.sel'); if(c) c.scrollIntoView({block:'nearest'});
}
sinput.addEventListener('input',e=>runSearch(e.target.value));
searchEl.addEventListener('click',e=>{ if(e.target===searchEl) closeSearch(); });
document.getElementById('sbtn').addEventListener('click',openSearch);
document.getElementById('menu').addEventListener('click',function(){
  document.getElementById('nav').classList.toggle('open');
});
document.addEventListener('keydown',function(e){
  const typing=/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); return; }
  if(e.key==='/'&&!typing){ e.preventDefault(); openSearch(); return; }
  if(searchEl.classList.contains('open')){
    if(e.key==='Escape') closeSearch();
    if(e.key==='ArrowDown'){ e.preventDefault(); moveSel(1); }
    if(e.key==='ArrowUp'){ e.preventDefault(); moveSel(-1); }
    if(e.key==='Enter'){ e.preventDefault(); pick(sel); }
    return;
  }
  if(typing) return;
  if(e.key==='Escape'&&location.hash&&location.hash!=='#browse') history.back();
  if(document.getElementById('sc-read').classList.contains('on')){
    const raw=decodeURIComponent(location.hash.replace(/^#/,'')).split('/');
    const t=BYID[raw[2]]; if(!t) return;
    if(e.key==='ArrowRight'){ const n=nextTopic(t); if(n){ e.preventDefault(); location.hash='t/'+n.sec.id+'/'+n.id; } }
    if(e.key==='ArrowLeft'){
      const i=topicIdx(t);
      const p = i>0 ? t.sec.topics[i-1] : (SECTIONS[SECTIONS.indexOf(t.sec)-1]||{topics:[]}).topics.slice(-1)[0];
      if(p){ e.preventDefault(); location.hash='t/'+p.sec.id+'/'+p.id; }
    }
    if(e.key.toLowerCase()==='r'){ e.preventDefault();
      if(isRead(t.id)) LS.del(rK(t.id)); else LS.set(rK(t.id),'1'); rerender(); }
  }
});

document.addEventListener('click',function(e){
  const fs=e.target.closest('#fsearch'); if(fs){ openSearch(); return; }
  const ls=e.target.closest('#landSearch'); if(ls){ openSearch(); return; }
  const ct=e.target.closest('[data-contact]');
  if(ct){ e.preventDefault(); toast('Add your '+ct.dataset.contact+' link in the CONTACT block of the file'); }
});
function stampYear(){ const y=document.getElementById('fyear'); if(y) y.textContent=new Date().getFullYear(); }
const _route=route;
route=function(){ _route(); stampYear(); };

route();
</script>
