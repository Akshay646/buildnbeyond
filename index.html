<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BuildNBeyond — .NET, data, observability and React</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0C10; --bg-2:#141419; --card:#1A1A21; --card-2:#22222B;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.22);
  --fg:#F2F2F5; --fg-2:#A7A7B4; --fg-3:#6E6E7C;
  --hot:#E4572E; --hot-2:#F0A184; --ok:#6FD08C; --flag:#E0B341;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  --head:62px;
  /* aliases so blocks written against the other palette resolve here */
  --display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --red:var(--hot);
  --red-2:var(--hot-2);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--head) + 18px)}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:var(--hot-2)}
:focus-visible{outline:2px solid var(--hot);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ================= top bar ================= */
.top{
  position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;gap:20px;
  padding:13px 30px;padding-top:calc(13px + env(safe-area-inset-top,0px));
  background:rgba(12,12,16,.97);backdrop-filter:saturate(1.3) blur(14px);
  border-bottom:1px solid var(--line);
  transition:background .2s ease,border-color .2s ease;
}
.top.solid{background:rgba(12,12,16,.99)}
body.on-land .top{
  background:linear-gradient(to bottom,rgba(12,12,16,.96),rgba(12,12,16,.55) 58%,transparent);
  border-bottom-color:transparent;backdrop-filter:none;
}
body.on-land .top.solid{background:rgba(12,12,16,.98);border-bottom-color:var(--line);backdrop-filter:blur(14px)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.03em;font-size:17px;flex:none}
.logo i{width:9px;height:19px;background:var(--hot);border-radius:2px;display:block}
.top nav{display:flex;gap:4px;font-size:13.5px}
.top nav button{padding:6px 11px;border-radius:7px;color:var(--fg-2)}
.top nav button:hover{color:var(--fg);background:rgba(255,255,255,.07)}
.top nav button.on{color:var(--fg);font-weight:500}
.sp{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.sbtn{
  display:flex;align-items:center;gap:9px;font-size:13px;color:var(--fg-2);
  border:1px solid var(--line);border-radius:100px;padding:7px 14px;
}
.sbtn:hover{border-color:var(--line-2);color:var(--fg)}
.sbtn kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.ring{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center}
.ring b{
  width:24.5px;height:24.5px;border-radius:50%;background:var(--bg);display:grid;place-items:center;
  font-size:9px;font-family:var(--mono);color:var(--fg-2);font-weight:500;
}
#menu{display:none;padding:6px;border-radius:8px;color:var(--fg-2)}

/* ================= screens ================= */
.screen{display:none;min-height:70vh}
.screen.on{display:block}

/* ================= hero ================= */
.hero{position:relative;padding:104px 30px 42px;overflow:hidden}
.hero::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(90% 125% at 84% 8%,rgba(228,87,46,.30),transparent 58%),
    radial-gradient(75% 95% at 10% 88%,rgba(93,78,214,.30),transparent 62%),
    var(--bg-2);
}
.hero::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(to top,var(--bg) 1%,transparent 58%)}
.hero > *{position:relative;z-index:1}
.eyebrow{font-family:var(--mono);font-size:11px;color:var(--hot);letter-spacing:.06em;margin:0 0 12px}
.hero h1{font-size:clamp(30px,5.6vw,52px);line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:0;max-width:17ch}
.hero .lede{max-width:54ch;color:var(--fg-2);margin:14px 0 0;font-size:15.5px}
.hmeta{display:flex;align-items:center;gap:11px;margin-top:15px;font-size:13px;color:var(--fg-3);flex-wrap:wrap}
.hmeta b{color:var(--ok);font-weight:500}
.cta{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:11px 22px;border-radius:7px;font-weight:600;font-size:14.5px;background:var(--fg);color:#111}
.btn:hover{background:#fff}
.btn.ghost{background:rgba(255,255,255,.14);color:var(--fg)}
.btn.ghost:hover{background:rgba(255,255,255,.24)}

/* ================= rows ================= */
.rows{padding-bottom:50px}
.row{padding:0 0 28px;position:relative}
.rhead{display:flex;align-items:center;gap:10px;padding:0 30px;margin:0 0 13px}
.rhead h2{font-size:16.5px;font-weight:600;letter-spacing:-.015em;margin:0}
.rhead em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--fg-3)}
.rhead .arrows{margin-left:auto;display:flex;gap:4px}
.rhead .arrows button{
  width:28px;height:28px;display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--line);color:var(--fg-2);font-size:13px;
}
.rhead .arrows button:hover{border-color:var(--line-2);color:var(--fg)}
.strip{display:flex;gap:13px;overflow-x:auto;padding:4px 30px 10px;scroll-snap-type:x proximity;scrollbar-width:none;scroll-behavior:smooth}
.strip::-webkit-scrollbar{display:none}
.card{
  flex:0 0 232px;scroll-snap-align:start;border-radius:var(--r);overflow:hidden;
  background:var(--card);border:1px solid var(--line);
  transition:transform .18s ease,border-color .18s ease;position:relative;
}
.card:hover{transform:translateY(-4px);border-color:var(--line-2)}
.art{height:114px;position:relative;display:flex;align-items:flex-end;padding:12px}
.art .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:5px}
.art .n{position:absolute;top:6px;right:13px;font-weight:800;font-size:42px;line-height:1;color:rgba(255,255,255,.18);letter-spacing:-.05em}
.art .play{
  position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,8,11,.5);
  opacity:0;transition:opacity .16s ease;font-size:15px;
}
.art .play span{width:42px;height:42px;border-radius:50%;background:var(--fg);color:#111;display:grid;place-items:center;padding-left:3px}
.card:hover .art .play{opacity:1}
.a1{background:linear-gradient(140deg,#5D4ED6,#2B2270)}
.a2{background:linear-gradient(140deg,#E4572E,#7A1F12)}
.a3{background:linear-gradient(140deg,#17876B,#0B3D32)}
.a4{background:linear-gradient(140deg,#2F6FD0,#152F63)}
.a5{background:linear-gradient(140deg,#C2377E,#5B1338)}
.a6{background:linear-gradient(140deg,#B4831C,#4E3708)}
.cbody{padding:11px 13px 13px}
.cbody b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.cbody p{margin:3px 0 0;font-size:12.5px;color:var(--fg-3);line-height:1.45;min-height:18px}
.bar{height:2.5px;background:rgba(255,255,255,.13);border-radius:2px;margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hot);border-radius:2px;transition:width .3s ease}
.bar.done i{background:var(--ok)}



/* ================= status deck (browse) ================= */
.deck{
  position:relative;padding:0 0 34px;
  padding-top:calc(var(--head) + 52px);
  padding-top:calc(var(--head) + 52px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--line);overflow:hidden;
}
.deck::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:radial-gradient(80% 120% at 88% 0%,rgba(229,9,20,.14),transparent 62%),
             radial-gradient(70% 120% at 8% 100%,rgba(255,255,255,.05),transparent 60%);
}
.deck-in{
  position:relative;z-index:1;max-width:1560px;margin:0 auto;
  padding:0 clamp(16px,3.4vw,48px);
  display:grid;grid-template-columns:auto 1fr minmax(300px,420px);
  gap:clamp(20px,3vw,44px);align-items:center;
}
.dial{position:relative;width:108px;height:108px;flex:none}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .dring{fill:none;stroke:rgba(255,255,255,.1);stroke-width:7}
.dial .dval{fill:none;stroke:var(--red);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
.dnum{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);letter-spacing:-.04em}
.dnum b{font-size:1.9rem;font-weight:700}
.dnum i{font-style:normal;font-size:.9rem;color:var(--fg-3);margin-left:1px}
.dstat{min-width:0}
.dlbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3);margin:0}
.dbig{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,3.1vw,2.3rem);letter-spacing:-.035em;margin:9px 0 0;line-height:1.05}
.dbig span{color:var(--fg-3);font-weight:500;font-size:.52em;letter-spacing:-.01em}
.dchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.dchips span{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--fg-2);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;
}
.resume{
  display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:left;
  transition:transform .22s var(--ease),border-color .22s var(--ease),background .22s var(--ease);
}
.resume:hover{transform:translateY(-3px);border-color:var(--line-2);background:var(--card-2)}
.rart{width:78px;height:50px;border-radius:7px;flex:none;overflow:hidden;position:relative}
.rart svg{width:100%;height:100%;display:block;opacity:.75}
.rtx{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.rtx em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red-2)}
.rtx b{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:-.02em;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rtx i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--fg-3)}
.rgo{
  width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--fg);color:#141414;font-size:13px;padding-left:2px;
}
@media(max-width:1080px){
  .deck-in{grid-template-columns:auto 1fr;gap:22px}
  .resume{grid-column:1/-1}
}
@media(max-width:560px){
  .deck{padding-top:calc(var(--head) + 30px)}
  .deck{padding-top:calc(var(--head) + 30px + env(safe-area-inset-top,0px))}
  .dial{width:84px;height:84px}
  .dnum b{font-size:1.5rem}
  .dchips span{font-size:9.5px;padding:4px 9px}
}

/* ---- grid filters + bento ---- */
.grid-h{flex-wrap:wrap}
.filters{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
.fil{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--fg-3);
  border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  transition:color .2s,border-color .2s,background .2s;
}
.fil:hover{color:var(--fg-2);border-color:var(--line-2)}
.fil.on{background:var(--fg);border-color:var(--fg);color:#141414;font-weight:500}
.band{margin-bottom:4px}
@media(min-width:900px){
  .gtile.wide{grid-column:span 2}
  .gtile.wide .gart{aspect-ratio:32/9}
  .band.solo .grid{grid-template-columns:repeat(2,minmax(0,1fr));max-width:820px}
  .band.solo .gart{aspect-ratio:32/9}
  .band.solo .gtile{grid-column:span 2}
}
.gridwrap{margin-top:30px}
.rows{margin-top:8px}

/* ================= section index grid ================= */
.gridwrap{max-width:1560px;margin:0 auto 46px;padding:0 clamp(16px,3.4vw,48px)}
.grid-h{display:flex;align-items:baseline;gap:12px;margin:14px 0 20px}
.grid-h h2{font-size:clamp(1.05rem,1.9vw,1.35rem);letter-spacing:-.02em}
.grid-h em{font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--fg-3);text-transform:uppercase}
.gband{
  display:flex;align-items:center;gap:11px;margin:26px 0 12px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-2);
}
.gband::after{content:"";flex:1;height:1px;background:var(--line)}
.gband span{
  order:3;font-size:9.5px;color:var(--fg-3);border:1px solid var(--line);
  border-radius:999px;padding:2px 8px;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:12px}
.gtile{
  display:flex;flex-direction:column;border-radius:9px;overflow:hidden;background:var(--card);
  border:1px solid transparent;text-align:left;
  transition:transform .22s var(--ease),border-color .22s var(--ease),background .22s var(--ease);
}
.gtile:hover{transform:translateY(-4px);border-color:var(--line-2);background:var(--card-2)}
.gart{position:relative;aspect-ratio:16/8;display:block;overflow:hidden}
.gart .cov{position:absolute;inset:0;opacity:.72}
.gart .cov svg{width:100%;height:100%;display:block}
.gtile:hover .gart .cov{opacity:.95}
.gpill{
  position:absolute;top:9px;left:10px;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;background:rgba(0,0,0,.5);color:var(--fg-2);padding:3px 7px;border-radius:3px;
}
.gdone{
  position:absolute;top:9px;right:10px;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
  background:rgba(70,211,105,.16);color:var(--ok);padding:3px 7px;border-radius:3px;
}
.gbody{padding:13px 14px 15px;display:flex;flex-direction:column;flex:1}
.gbody b{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:-.02em;line-height:1.25}
.gtag{font-size:12.5px;color:var(--fg-3);line-height:1.45;margin-top:5px;flex:1}
.gmeta{
  display:flex;align-items:center;gap:7px;margin-top:11px;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--fg-3);text-transform:uppercase;
}
.gmeta i{font-style:normal;opacity:.5}
.gbody .bar{margin-top:10px}
@media(max-width:620px){
  .grid{grid-template-columns:1fr 1fr;gap:9px}
  .gbody{padding:11px 11px 13px}
  .gbody b{font-size:13.5px}
  .gtag{display:none}
}

/* rails: cap the page and let a short rail breathe rather than leave a hole */
.rails{max-width:1560px;margin:-6vh auto 0}
.rail .track{scroll-snap-type:x proximity}

/* ================= section screen ================= */
.shero{position:relative;padding:96px 30px 24px;overflow:hidden}
.shero::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(85% 135% at 20% 0%,rgba(93,78,214,.34),transparent 60%),var(--bg-2)}
.shero.h2::before{background:radial-gradient(85% 135% at 20% 0%,rgba(228,87,46,.30),transparent 60%),var(--bg-2)}
.shero.h3::before{background:radial-gradient(85% 135% at 20% 0%,rgba(23,135,107,.34),transparent 60%),var(--bg-2)}
.shero.h4::before{background:radial-gradient(85% 135% at 20% 0%,rgba(47,111,208,.32),transparent 60%),var(--bg-2)}
.shero.h5::before{background:radial-gradient(85% 135% at 20% 0%,rgba(194,55,126,.30),transparent 60%),var(--bg-2)}
.shero.h6::before{background:radial-gradient(85% 135% at 20% 0%,rgba(180,131,28,.30),transparent 60%),var(--bg-2)}
.shero::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(to top,var(--bg),transparent 64%)}
.shero > *{position:relative;z-index:1}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--fg-2);font-size:13.5px;margin-bottom:16px}
.back:hover{color:var(--fg)}
.shero h1{font-size:clamp(26px,5vw,42px);letter-spacing:-.03em;font-weight:800;margin:0}
.shero .lede{color:var(--fg-2);max-width:58ch;margin:11px 0 0}
.chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--mono);font-size:10.5px;color:var(--fg-2);border:1px solid var(--line);border-radius:100px;padding:5px 11px}
.chip.hot{color:var(--hot-2);border-color:rgba(228,87,46,.45)}
.chip.ok{color:var(--ok);border-color:rgba(111,208,140,.4)}

.eplist{padding:8px 30px 60px;max-width:1080px}
.ep{
  display:flex;gap:15px;align-items:flex-start;width:100%;
  padding:15px 12px;border-bottom:1px solid var(--line);border-radius:var(--r);
  transition:background .14s ease;
}
.ep:hover{background:var(--card)}
.ep.reading{background:var(--card);box-shadow:inset 2px 0 0 var(--hot)}
.epthumb{
  flex:none;width:74px;height:48px;border-radius:7px;position:relative;
  display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-weight:500;
  color:rgba(255,255,255,.72);overflow:hidden;
}
.epthumb .pl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,8,11,.55);opacity:0;transition:opacity .15s}
.ep:hover .epthumb .pl{opacity:1}
.eptx{flex:1;min-width:0;cursor:pointer}
.eptx b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.012em;line-height:1.35}
.eptx p{margin:4px 0 0;font-size:13.5px;color:var(--fg-3);line-height:1.5}
.eprt{flex:none;display:flex;align-items:center;gap:6px;padding-top:4px}
.eprt .len{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.ico{
  width:30px;height:30px;display:grid;place-items:center;border-radius:50%;
  color:var(--fg-3);font-size:13px;transition:color .14s,background .14s;
}
.ico:hover{background:rgba(255,255,255,.1);color:var(--fg)}
.ico.on{color:var(--ok)}
.ico.flagon{color:var(--flag)}
.ico.noteon{color:var(--hot-2)}
.epmore{
  grid-column:1/-1;width:100%;padding:0 12px 16px 101px;color:var(--fg-2);font-size:14px;
  border-bottom:1px solid var(--line);
}
.epmore .k{font-family:var(--mono);font-size:10px;color:var(--fg-3);display:block;margin-bottom:6px}

/* ================= reading ================= */
.rwrap{padding:96px 30px 70px;max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:40px}
.read{min-width:0}
.rside{position:sticky;top:90px;align-self:start}
.rside .lbl{font-family:var(--mono);font-size:10px;color:var(--fg-3);letter-spacing:.1em;margin:0 0 10px}
.rside ol{list-style:none;margin:0 0 22px;padding:0;border-left:1px solid var(--line)}
.rside ol button{display:block;width:100%;padding:6px 12px;font-size:12.5px;color:var(--fg-3);line-height:1.4}
.rside ol button:hover{color:var(--fg)}
.rside ol li.cur button{color:var(--fg);box-shadow:inset 2px 0 0 var(--hot)}
.rside ol li.done button{color:var(--fg-2)}
.kicker{font-family:var(--mono);font-size:11px;color:var(--hot);margin:0 0 9px}
.read h1{font-size:clamp(24px,4.4vw,34px);letter-spacing:-.03em;font-weight:700;margin:0;line-height:1.15}
.tools{display:flex;gap:8px;margin:20px 0 26px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--fg-2);border:1px solid var(--line);border-radius:7px;padding:7px 13px}
.tool:hover{border-color:var(--line-2);color:var(--fg)}
.tool.on{border-color:rgba(111,208,140,.5);color:var(--ok)}
.tool.flagon{border-color:rgba(224,179,65,.5);color:var(--flag)}
.tool.noteon{border-color:rgba(228,87,46,.5);color:var(--hot-2)}

.read h4{font-size:15.5px;font-weight:600;margin:28px 0 9px;letter-spacing:-.012em}
.read h5{font-size:13.5px;font-weight:600;margin:20px 0 6px;color:var(--fg-2)}
.read p{margin:0 0 13px;color:#DCDCE4}
.read ul,.read ol{margin:0 0 15px;padding-left:21px;color:#DCDCE4}
.read li{margin-bottom:5px}
.read li::marker{color:var(--fg-3)}
.read b{font-weight:600;color:var(--fg)}
.read code{font-family:var(--mono);font-size:.855em;background:rgba(255,255,255,.08);padding:1.5px 5px;border-radius:5px}
.read blockquote{margin:0 0 15px;padding:12px 16px;background:var(--card);border-left:2px solid var(--line-2);border-radius:0 var(--r) var(--r) 0}
.read blockquote p{margin:0 0 8px}
.read blockquote p:last-child{margin:0}
.read blockquote.say{border-left-color:var(--hot);background:rgba(228,87,46,.09)}
.read blockquote.say p{font-style:italic;color:#EFE3DE}
.read table{width:100%;border-collapse:collapse;margin:6px 0 18px;font-size:14px;display:block;overflow-x:auto}
.read th,.read td{text-align:left;padding:9px 14px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.read th{font-size:11.5px;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em}
.read dl.qa dt{font-weight:600;font-size:14.5px;margin-top:13px}
.read dl.qa dd{margin:2px 0 0;color:var(--fg-2)}
.tagline{font-family:var(--mono);font-size:11px;letter-spacing:.07em;color:var(--fg-3);margin:-4px 0 15px}
.intent{font-size:13.5px;color:var(--fg-3);border-left:2px solid var(--line-2);padding-left:12px;margin:0 0 15px}
.filepath{font-family:var(--mono);font-size:11.5px;color:var(--fg-3);margin:18px 0 6px}
.tags{font-family:var(--mono);font-size:11.5px;color:var(--flag);margin:0 0 12px}
.note-src{font-size:13.5px;color:var(--fg-3);border-top:1px solid var(--line);padding-top:13px;margin-top:20px}
.xref{font-size:13.5px;color:var(--fg-3)}
.warn{color:var(--hot-2)}
.bad-line::before{content:"✕ ";color:var(--hot)}
.good-line::before{content:"✓ ";color:var(--ok)}
.read ul.bad li::marker{content:"✕  ";color:var(--hot)}
.fix{
  font-size:13px;color:var(--flag);background:rgba(224,179,65,.09);
  border-left:2px solid var(--flag);border-radius:0 8px 8px 0;padding:9px 13px;margin:0 0 14px;
}
.fix::before{content:"Corrected  ";font-family:var(--mono);font-size:10px;letter-spacing:.1em;opacity:.8}
.tier{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--card)}
.tier-head{display:flex;align-items:baseline;gap:10px}
.tier-num{font-weight:600;font-size:15px}
.tier-lab{font-family:var(--mono);font-size:10px;letter-spacing:.11em;color:var(--hot)}
.tier-items{margin:6px 0 0;font-size:14.5px;color:var(--fg-2)}

figure.code{margin:0 0 16px;background:#08080B;border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
figure.code::before{content:attr(data-lang);position:absolute;top:8px;left:14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;color:var(--fg-3)}
figure.code pre{margin:0;padding:30px 14px 14px;overflow-x:auto;font-family:var(--mono);font-size:12.7px;line-height:1.62;color:#D6D6E0}
figure.code code{background:none;padding:0;font-size:inherit}
figure.code .cp{position:absolute;top:5px;right:6px;padding:4px 10px;border-radius:7px;font-size:11px;color:var(--fg-3);opacity:0;transition:opacity .15s}
figure.code:hover .cp,figure.code .cp:focus-visible{opacity:1}
figure.code .cp:hover{background:rgba(255,255,255,.1);color:var(--fg)}
.tok-c{color:#6E6E7C;font-style:italic}
.tok-s{color:#7FD1A0}
.tok-k{color:#C79BF5}
.tok-n{color:#E8A87C}

.notebox{border-left:2px solid var(--hot);background:rgba(228,87,46,.08);border-radius:0 var(--r) var(--r) 0;padding:13px 15px;margin:0 0 22px;display:none}
.notebox.open{display:block}
.notebox label{display:block;font-family:var(--mono);font-size:10px;color:var(--hot-2);letter-spacing:.1em;margin-bottom:7px}
.notebox textarea{width:100%;min-height:62px;background:none;border:0;color:var(--fg);font-family:var(--sans);font-size:14.5px;line-height:1.55;resize:vertical}
.notebox textarea:focus{outline:none}
.notebox textarea::placeholder{color:var(--fg-3)}
.nfoot{display:flex;align-items:center;gap:10px;margin-top:8px}
.nfoot span{font-family:var(--mono);font-size:10px;color:var(--fg-3);margin-right:auto}
.nfoot button{font-size:12px;padding:4px 11px;border-radius:7px;border:1px solid var(--line)}
.nfoot button:hover{border-color:var(--line-2)}

.upnext{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:32px;width:100%}
.upnext:hover{border-color:var(--line-2)}
.upnext em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--fg-3);display:block;letter-spacing:.1em}
.upnext b{font-size:14.5px;font-weight:600}
.upnext .go{margin-left:auto;color:var(--fg-3);font-size:18px}


/* ================= reading comfort ================= */
.readline{
  position:fixed;top:var(--head);left:0;right:0;height:2px;z-index:68;
  opacity:0;transition:opacity .2s var(--ease);pointer-events:none;
}
.readline i{display:block;height:100%;width:0;background:var(--hot);transition:width .08s linear}

.sbar{
  position:fixed;top:var(--head);left:0;right:0;z-index:67;
  display:flex;align-items:center;gap:14px;padding:10px clamp(16px,3.4vw,48px);
  background:rgba(12,12,16,.98);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);
  transform:translateY(-130%);transition:transform .25s var(--ease);
}
.sbar.on{transform:none}
.sbar .st{
  font-family:var(--sans);font-weight:600;font-size:14px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
}
.sb-act{display:flex;gap:8px;flex:none}
.sb{
  font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;color:var(--fg-2);transition:border-color .2s,color .2s,background .2s;
}
.sb:hover{border-color:var(--line-2);color:var(--fg)}
.sb.on{color:var(--ok);border-color:rgba(111,208,140,.45)}
.sb.next{background:var(--fg);color:#0C0C10;border-color:var(--fg);font-weight:600}
@media(max-width:620px){.sbar .st{font-size:13px}.sb{padding:6px 10px}}

.outline{margin-bottom:26px}
.ol-out{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.ol-out li button{
  display:block;width:100%;text-align:left;padding:6px 12px;font-size:12.5px;
  color:var(--fg-3);line-height:1.4;transition:color .2s var(--ease);
}
.ol-out li button:hover{color:var(--fg-2)}
.ol-out li.cur button{color:var(--fg);box-shadow:inset 2px 0 0 var(--hot)}

.finish{display:flex;gap:9px;flex-wrap:wrap;margin-top:34px;padding-top:26px;border-top:1px solid var(--line)}
.fbtn{
  font-size:14px;font-weight:500;padding:12px 22px;border-radius:8px;
  border:1px solid var(--line-2);color:var(--fg-2);transition:all .2s var(--ease);
}
.fbtn:hover{border-color:var(--fg-3);color:var(--fg)}
.fbtn.on{color:var(--ok);border-color:rgba(111,208,140,.45)}
.fbtn.go{background:var(--hot);border-color:var(--hot);color:#fff;font-weight:600}
.fbtn.go:hover{filter:brightness(1.1)}

.totop{
  position:fixed;right:clamp(14px,2.4vw,28px);bottom:calc(22px + env(safe-area-inset-bottom,0px));
  z-index:66;width:42px;height:42px;border-radius:50%;
  background:rgba(26,26,33,.95);border:1px solid var(--line);color:var(--fg-2);font-size:16px;
  display:grid;place-items:center;opacity:0;pointer-events:none;backdrop-filter:blur(10px);
  transition:opacity .22s var(--ease),transform .22s var(--ease),color .2s;
}
.totop.on{opacity:1;pointer-events:auto}
.totop:hover{color:var(--fg);transform:translateY(-3px)}

/* ================= list pages ================= */
.page{padding:96px 30px 70px;max-width:840px;margin:0 auto}
.page h1{font-size:clamp(26px,5vw,38px);letter-spacing:-.03em;font-weight:800;margin:0 0 8px}
.page > .lede{color:var(--fg-2);margin:0 0 26px}
.ncard{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--card)}
.ncard .src{font-family:var(--mono);font-size:10.5px;color:var(--fg-3);letter-spacing:.06em;margin:0 0 6px}
.ncard b{font-size:15.5px;font-weight:600;display:block;margin-bottom:8px}
.ncard .body{white-space:pre-wrap;color:#DCDCE4;font-size:14.5px;border-left:2px solid var(--hot);padding-left:12px}
.ncard .acts{display:flex;gap:8px;margin-top:12px}
.empty{border:1px dashed var(--line-2);border-radius:12px;padding:30px 24px;color:var(--fg-3)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}

/* ================= search ================= */
#search{position:fixed;inset:0;z-index:90;display:none;padding:0 16px;padding-top:max(9vh,90px);background:rgba(6,6,9,.72);backdrop-filter:blur(4px)}
#search.open{display:block}
.sbox{max-width:640px;margin:0 auto;background:var(--card);border:1px solid var(--line-2);border-radius:14px;overflow:hidden;max-height:78vh;display:flex;flex-direction:column}
.sbox input{width:100%;padding:17px 20px;border:0;background:none;color:var(--fg);font-family:var(--sans);font-size:16px;border-bottom:1px solid var(--line)}
.sbox input:focus{outline:none}
#sres{overflow-y:auto;padding:6px}
#sres button{display:block;width:100%;padding:10px 14px;border-radius:9px}
#sres button:hover,#sres button.sel{background:var(--card-2)}
#sres .rs{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--fg-3)}
#sres .rt{font-weight:500;font-size:14.5px;margin-top:2px}
#sres .rx{font-size:12.5px;color:var(--fg-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sres mark{background:rgba(228,87,46,.3);color:var(--fg);border-radius:3px;padding:0 2px}
.sempty{padding:24px 20px;color:var(--fg-3);font-size:14.5px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:95;
  background:var(--card-2);border:1px solid var(--line-2);border-radius:100px;
  padding:10px 20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}


.primer{padding:6px 30px 26px;max-width:1080px}
.primer .plbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--hot);margin:0 0 10px}
.primer .read{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;max-width:none}
.primer .read > *:first-child{margin-top:0}
.primer .read > *:last-child{margin-bottom:0}
.primer .read h4{font-size:14.5px;margin:20px 0 8px}
.primer .read p,.primer .read li{font-size:14.5px}
.eplbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--fg-3);margin:20px 0 6px;padding-left:12px}
.leadin{border-left:2px solid var(--hot);padding:2px 0 2px 16px;margin:0 0 24px;font-size:16.5px;line-height:1.6;color:#CFCFDA}
.leadin p{margin:0 0 10px;color:inherit}
.leadin p:last-child{margin:0}
.leadin code{font-size:.85em}


/* ---- cover art on cards ---- */
.art .cov{position:absolute;inset:0;overflow:hidden;opacity:.75;pointer-events:none}
.art .cov svg{width:100%;height:100%;display:block}
.card:hover .art .cov{opacity:.9}
.sherocov{
  position:absolute;right:-30px;top:0;width:min(46%,430px);height:100%;
  opacity:.16;pointer-events:none;z-index:0;
}
.sherocov svg{width:100%;height:100%;display:block}

/* ---- animated hero ---- */
.heroart{position:absolute;inset:0;z-index:0;overflow:hidden;opacity:.42;pointer-events:none;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 28%,#000 100%);
  mask-image:linear-gradient(to right,transparent,#000 28%,#000 100%)}
.heroart svg{width:100%;height:100%;display:block}
.heroart .grid path{stroke:#fff;stroke-width:.7;opacity:.07;fill:none}
.heroart .wire{fill:none;stroke:#fff;stroke-width:1.6;opacity:.24;stroke-linecap:round}
.heroart .wire.w2{opacity:.14}
.heroart .nodes rect{fill:none;stroke:#fff;stroke-width:1.5;opacity:.3}
.heroart .pk{fill:#E4572E;filter:none}
.heroart .pk.p2{fill:#fff;opacity:.8}
.heroart .pk.p3{fill:#5D4ED6}
.heroart .braces text{fill:#fff;opacity:.1;font-family:var(--mono);font-size:96px;font-weight:500}

/* ---- useful resources ---- */
.res{margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
.reslbl{font-size:13px;font-weight:600;margin:0 0 14px;color:var(--fg-2);
  font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase}
.resgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:10px}
.rescard{
  display:flex;align-items:center;gap:12px;padding:11px 13px;text-decoration:none;
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--fg);
  transition:border-color .15s ease,transform .15s ease;
}
.rescard:hover{border-color:var(--line-2);transform:translateY(-2px)}
.resthumb{
  width:40px;height:40px;border-radius:8px;flex:none;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;letter-spacing:.02em;
}
.restx{min-width:0;flex:1}
.restx b{display:block;font-size:13.5px;font-weight:500;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.restx em{font-style:normal;font-size:11.5px;color:var(--fg-3);font-family:var(--mono)}
.resgo{color:var(--fg-3);font-size:13px;flex:none}
.rescard:hover .resgo{color:var(--hot-2)}

/* ---- footer ---- */
.foot{border-top:1px solid var(--line);margin-top:20px;background:#08080B}
.fgrid{max-width:1180px;margin:0 auto;padding:46px 30px 32px;
  display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:36px}
.fabout p{color:var(--fg-3);font-size:13.5px;margin:14px 0 0;max-width:42ch;line-height:1.65}
.fabout .logo{font-size:15px}
.fauthor{display:flex;flex-direction:column;gap:2px;margin-top:16px!important}
.fauthor b{color:var(--fg);font-size:14px;font-weight:600}
.fauthor span{font-size:12.5px;color:var(--fg-3)}
.fcol h4{font-size:12px;font-family:var(--mono);letter-spacing:.12em;color:var(--fg-2);
  margin:0 0 14px;text-transform:uppercase;font-weight:500}
.fcol button,.fcol a{display:block;font-size:13.5px;color:var(--fg-3);padding:4px 0;text-decoration:none}
.fcol button:hover,.fcol a:hover{color:var(--fg)}
.fnote{font-size:11.5px;color:#4E4E5A;margin:12px 0 0;line-height:1.5}
.fbar{max-width:1180px;margin:0 auto;padding:16px 30px 34px;border-top:1px solid var(--line);
  display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--fg-3)}
.fmeta{margin-left:auto;color:#4E4E5A}


.heroimg{position:absolute;inset:0;z-index:0;overflow:hidden}
.heroimg img{width:100%;height:100%;object-fit:cover;object-position:70% 42%;display:block}
.heroimg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to right,rgba(12,12,16,.97) 0%,rgba(12,12,16,.86) 34%,rgba(12,12,16,.35) 68%,rgba(12,12,16,.55) 100%),
             linear-gradient(to top,var(--bg) 2%,transparent 46%);
}
.bi{width:15px;height:15px;flex:none}
.back{align-items:center}
.epthumb .tic{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.9)}
.epthumb .tic svg{width:15px;height:15px}
.epthumb.read .tic{color:var(--ok)}
.epthumb .tcov{position:absolute;inset:0;opacity:.5}
.epthumb .tcov svg{width:100%;height:100%;display:block}
.epthumb .pl svg{width:15px;height:15px}
.ep:hover .epthumb .tic{opacity:0}
.fcontact a{display:flex;align-items:center;gap:9px}
.fcontact svg{width:15px;height:15px;flex:none;opacity:.8}
.fcontact a:hover svg{opacity:1}


/* ---------- landing ---------- */
.land{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;overflow:hidden}
.landbg{position:absolute;inset:0;z-index:0}
.landbg img{width:100%;height:100%;object-fit:cover;object-position:62% 50%;display:block}
.landbg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to right,rgba(8,10,16,.95) 0%,rgba(8,10,16,.80) 40%,rgba(8,10,16,.30) 75%,rgba(8,10,16,.55) 100%),
             linear-gradient(to top,var(--bg) 1%,transparent 40%);
}
.landin{position:relative;z-index:1;width:100%;max-width:1180px;margin:0 auto;
  padding:120px 30px 70px;padding-top:calc(120px + env(safe-area-inset-top,0px))}
.landlogo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.03em;margin-bottom:34px}
.landlogo i{width:10px;height:21px;background:var(--hot);border-radius:2px;display:block}
.land h1{font-size:clamp(38px,7vw,74px);line-height:1.02;letter-spacing:-.04em;font-weight:800;margin:0;max-width:14ch}
.landlede{max-width:56ch;color:var(--fg-2);font-size:17px;margin:20px 0 0;line-height:1.6}
.landstats{display:flex;gap:30px;margin:28px 0 0;flex-wrap:wrap}
.landstats span{display:flex;flex-direction:column;font-size:12px;color:var(--fg-3);
  font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.landstats b{font-family:var(--sans);font-size:28px;font-weight:700;color:var(--fg);letter-spacing:-.03em;text-transform:none}
.landcta{display:flex;gap:11px;margin-top:32px;flex-wrap:wrap}
.lbtn{padding:14px 34px;font-size:15.5px}
.landauth{display:flex;gap:14px;align-items:flex-start;margin-top:44px;padding-top:26px;
  border-top:1px solid var(--line);max-width:62ch}
.lavatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,#E4572E,#7A1F12);font-weight:700;font-size:15px;letter-spacing:-.01em}
.lameta{display:flex;flex-direction:column;gap:3px}
.lameta b{font-size:15px;font-weight:600}
.lameta span{font-size:13.5px;color:var(--fg-3);line-height:1.55}
.landwhat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px;max-width:940px}
.lw{border:1px solid var(--line);border-radius:12px;padding:18px 19px;background:rgba(20,20,26,.55);backdrop-filter:blur(6px)}
.lw h3{font-size:13px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--hot-2);margin:0 0 9px;font-weight:500}
.lw p{margin:0;font-size:14px;color:var(--fg-2);line-height:1.6}
.landscroll{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;z-index:1;
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);color:var(--fg-2);
  display:grid;place-items:center;font-size:15px}
.landscroll:hover{color:var(--fg);border-color:var(--fg-3)}
button.logo{padding:0}

@media (max-width:1000px){
  .rwrap{grid-template-columns:minmax(0,1fr);gap:0}
  .rside{display:none}
}
@media (max-width:760px){
  body{font-size:15px}
  .top{padding:11px 16px;padding-top:calc(11px + env(safe-area-inset-top,0px));gap:10px}
  .top nav{display:none}
  .top nav.open{
    display:flex;position:absolute;top:100%;left:12px;right:12px;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;gap:2px;
  }
  .top nav.open button{padding:11px 13px}
  #menu{display:grid;place-items:center}
  .sbtn span,.sbtn kbd{display:none}
  .sbtn{padding:8px;border-radius:50%}
  .hero{padding:86px 16px 32px}
  .rhead{padding:0 16px}
  .rhead .arrows{display:none}

<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const KW={
  csharp:/\b(public|private|protected|internal|static|readonly|sealed|partial|abstract|virtual|override|class|interface|struct|enum|namespace|using|void|var|new|return|async|await|if|else|for|foreach|in|while|switch|case|throw|try|catch|finally|get|set|this|base|null|true|false|int|long|short|bool|string|decimal|double|float|object|Task|const|out|ref|is|as|default|record)\b/g,
  js:/\b(const|let|var|function|return|import|from|export|default|async|await|if|else|for|while|do|try|catch|finally|new|class|extends|this|null|undefined|true|false|typeof|instanceof|of|in|switch|case|break|continue)\b/g,
  sql:/\b(SELECT|FROM|WHERE|AND|OR|INSERT|INTO|UPDATE|SET|DELETE|CREATE|PROCEDURE|AS|BEGIN|END|EXEC|INDEX|ON|JOIN|LEFT|RIGHT|INNER|OUTER|CROSS|GROUP|BY|ORDER|HAVING|LIMIT|OFFSET|TRANSACTION|COMMIT|ROLLBACK|WITH|TABLE|DECLARE|VALUES|NOT|NULL|DISTINCT|TOP|OVER|PARTITION|ROW_NUMBER|RANK|DENSE_RANK|LAG|LEAD)\b/gi,
  http:/\b(GET|POST|PUT|PATCH|DELETE|HEAD|Authorization|Bearer|Header)\b/g
};
KW.jsx=KW.js;
function paint(chunk,lang){
  let s=esc(chunk); const kw=KW[lang];
  if(kw) s=s.replace(kw,m=>'\u0001k\u0002'+m+'\u0003');
  s=s.replace(/\b(\d+(?:\.\d+)?)\b/g,'\u0001n\u0002$1\u0003');
  return s.replace(/\u0001([kn])\u0002([\s\S]*?)\u0003/g,(_,c,t)=>'<span class="tok-'+c+'">'+t+'</span>');
}
function hl(src,lang){
  if(lang==='text') return esc(src);
  const rx=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|--[^\n]*|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')/g;
  let out='',last=0,m;
  while((m=rx.exec(src))){
    out+=paint(src.slice(last,m.index),lang);
    const t=m[0], cls=(t[0]==='/'||t.slice(0,2)==='--')?'tok-c':'tok-s';
    out+='<span class="'+cls+'">'+esc(t)+'</span>';
    last=rx.lastIndex;
  }
  return out+paint(src.slice(last),lang);
}
const LANGNAME={csharp:'C#',js:'JavaScript',jsx:'JSX',sql:'SQL',json:'JSON',http:'HTTP',text:''};
function cb(lang,src){
  const nm=LANGNAME[lang]===undefined?lang:LANGNAME[lang];
  return '<figure class="code" data-lang="'+nm+'"><pre><code>'+hl(src.replace(/^\n+|\n+$/g,''),lang)+
         '</code></pre><button class="cp" type="button">Copy</button></figure>';
}
</script>

        <h4>1. Transient</h4>

        <ul>
          <li>Focus: <b>one responsibility</b></li>
          <li>Avoid: classes doing multiple unrelated things</li>

        <h4>O — Open/Closed Principle (OCP)</h4>
        <p>Software should be <b>open for extension, closed for modification</b>.</p>

        <p>Use <code>CancellationTokenSource</code> with a timeout on outgoing calls, cancel if exceeded, and return 504 to protect your API.</p>
        <h4>Problem</h4>
        <p>Your API calls a <b>third-party service</b> which may be slow, hang, or never respond. You must <b>protect your API</b>.</p>
        <h4>Cancellation token handling — ASP.NET Core default behavior</h4>
        ${cb('csharp', `[HttpGet("orders")]
public async Task<IActionResult> GetOrders(CancellationToken ct)
{
    // ct is automatically bound to HttpContext.RequestAborted
    await _service.GetOrdersAsync(ct);
    return Ok();
}`)}
        <p><b>Point:</b> In ASP.NET Core, a <code>CancellationToken</code> is always injected into controller actions (via <code>HttpContext.RequestAborted</code>), even if the client does not explicitly pass one; it still triggers on client disconnects or server/runtime events.</p>
        <h4>Cancellation token handling for third-party API calls</h4>
        ${cb('csharp', `public class ExternalApiClient
{
    private readonly HttpClient _httpClient;

    public ExternalApiClient(HttpClient httpClient)
    {
        _httpClient = httpClient;
    }

    public async Task<string> GetDataAsync(CancellationToken ct)
    {
        // Link incoming request token with your own timeout
        using var cts = CancellationTokenSource.CreateLinkedTokenSource(ct);
        cts.CancelAfter(TimeSpan.FromSeconds(5));

        var response = await _httpClient.GetAsync(
            "https://thirdparty.com/api/data",
            cts.Token
        );

        response.EnsureSuccessStatusCode();
        return await response.Content.ReadAsStringAsync(cts.Token);
    }
}`)}
        <p><b>Point:</b> When calling external APIs using HttpClient, always <b>propagate the incoming CancellationToken and optionally link it with a timeout</b> using <code>CancellationTokenSource.CreateLinkedTokenSource</code>; this ensures both client disconnects and your own safeguards can cancel the call without breaking the cancellation chain.</p>
        <h4>Key points</h4>
        <ul>
          <li>Use <b>CancellationTokenSource(timeout)</b></li>
          <li>Pass the token to <b>HttpClient</b></li>
          <li>Timeout → <code>TaskCanceledException</code></li>
          <li>Convert to <b>504 Gateway Timeout</b></li>
          <li>Do NOT wait indefinitely</li>
        </ul>`
    },

      id: 'aspnet-thread-safety',

        <p>In ASP.NET Core, thread safety is mainly about <b>avoiding shared mutable state across concurrent requests</b>.</p>
        <h4>1) Start with design — most important</h4>
        <ul>
          <li>Prefer <b>stateless services</b></li>
          <li>Use <b>Scoped lifetime</b> for request-specific data</li>
          <li>Be careful with <b>Singletons</b> → they are shared across all requests</li>
        </ul>
        <h4>2) When shared state is unavoidable</h4>
        <p>Use <b>thread-safe constructs</b>:</p>
        <ul>
          <li><code>ConcurrentDictionary</code>, <code>ConcurrentQueue</code></li>
          <li><code>Interlocked</code> for atomic operations</li>
          <li><code>SemaphoreSlim</code> for async coordination</li>
        </ul>
        <blockquote><p><b>Atomic = happens as one indivisible step.</b> No other thread can see or interfere with it halfway.</p></blockquote>
        <h4>3) Locks — use carefully</h4>
        <ul>
          <li>Use <code>lock</code> only for <b>small, low-contention critical sections</b></li>
          <li>Avoid in high-throughput paths</li>
          <li>Avoid in async flows (can block threads)</li>
        </ul>
        <h4>4) Async correctness</h4>
        <ul>
          <li>Avoid blocking (<code>.Result</code>, <code>.Wait()</code>)</li>
          <li>Prefer async-safe coordination (<code>SemaphoreSlim.WaitAsync</code>)</li>
        </ul>
        <h4>When I avoid locks</h4>
        <ul>
          <li>High contention scenarios (performance hit)</li>
          <li>Async code (risk of blocking / deadlocks)</li>
          <li>When atomic operations or concurrent collections can solve it</li>
        </ul>`
    },
    {
      id: 'aspnet-sessions-cookies',
      title: 'Sessions and cookies',
      html: `
        <h4>Cookies</h4>
        <ul>
          <li>Stored in the <b>browser</b></li>
          <li>Sent automatically with each request</li>
          <li>Can hold: session id, JWT, small data (preferences)</li>
          <li>By themselves → <b>stateless</b> (if no server lookup)</li>
        </ul>
        <h4>Sessions</h4>
        <ul>
          <li>Stored on the <b>server</b> (memory / Redis / DB)</li>
          <li>Hold user state</li>
          <li>Need an <b>identifier</b> (usually from a cookie)</li>
        </ul>
        <h4>Common pattern — together</h4>
        <ol>
          <li>Server creates session → sessionId</li>
          <li>Sends cookie: <code>Set-Cookie: sessionId=xyz</code></li>
          <li>Browser sends back: <code>Cookie: sessionId=xyz</code></li>
          <li>Server fetches session using that ID</li>
        </ol>
        <p>→ <b>Stateful system</b></p>
        <h4>Independent usage</h4>
        <p><b>Cookies only</b> — store JWT in cookie, no server storage → <b>stateless</b>.</p>
        <p><b>Sessions without cookies</b> — ID via headers / query / mobile storage. Possible but uncommon.</p>
        <h4>Key difference</h4>
        <ul>
          <li>Cookie = <b>client-side transport/storage</b></li>
          <li>Session = <b>server-side state</b></li>
        </ul>
        <h4>Architecture rule</h4>
        <ul>
          <li><b>Stateless APIs</b> → JWT (cookie or header), no server session</li>
          <li><b>Web apps (BFF)</b> → session + cookie (server-managed state)</li>
        </ul>
        <h4>Important nuance</h4>
        <ul>
          <li>Cookie ≠ stateful by default</li>
          <li>Becomes stateful only if the server <b>stores and depends on session data</b></li>
        </ul>`
    }
  ]
});

        <p><b>List:</b> a concrete collection that holds data in memory.</p>

foreach (var u in users) { }   // executes SQL`)}
        <h4>Easy way to remember</h4>
        <ul>
          <li><code>IQueryable</code> = query is still being built.</li>

    {

      title: 'Garbage collection',
      html: `
        <p><b>Manages memory automatically in the .NET runtime.</b></p>
        <h4>What GC actually does</h4>
        <ul>
          <li>Allocates objects on the <b>managed heap</b></li>
          <li>Tracks which objects are <b>still reachable</b></li>
          <li>Frees memory of objects that are <b>no longer referenced</b></li>
        </ul>
        <h4>Generations in GC</h4>
        <p><b>Division of objects based on how long they have survived in memory.</b></p>
        <h5>Generation 0</h5>
        <ul>
          <li>New objects are created here</li>
          <li>Very fast collection</li>
          <li>Happens frequently</li>
        </ul>
        <p>Example: <code>var obj = new MyClass();</code> goes to Gen 0. If the object dies quickly it is collected here.</p>
        <h5>Generation 1</h5>
        <ul>
          <li>Buffer between short-lived and long-lived objects</li>
          <li>Objects that survive Gen 0 move here</li>
        </ul>
        <h5>Generation 2</h5>
        <ul>
          <li>Long-lived objects</li>
          <li>Survived multiple GC cycles</li>
          <li>Collected less frequently (expensive)</li>
        </ul>
        <p>Examples: static objects, app-level caches, long-running services.</p>
        <h4>Why generations exist</h4>
        <p>If GC treated all objects the same, every collection would scan the <b>entire heap</b> — slow and unnecessary. Instead GC optimizes:</p>
        <h5>1. Focus on where garbage actually is</h5>
        <p>Most garbage is in <b>newly created objects (Gen 0)</b>, so GC cleans Gen 0 frequently — cheap and fast.</p>
        <h5>2. Avoid touching long-lived objects repeatedly</h5>
        <p>Objects that survived multiple cycles are likely still in use and expensive to scan again and again. So GC moves them to <b>Gen 2</b> and scans them <b>rarely</b>.</p>
        <h5>3. Reduce pause time — the real goal</h5>
        <p>Full heap scan = long pause. Gen 0 scan = very short pause. Critical for UI apps (no freezing) and backend services (low latency).</p>`
    },

        <p>IDisposable is for <b>cleanup of unmanaged resources</b> — things GC doesn't handle.</p>
        <p><b>Unmanaged resources</b> = things beyond the heap or memory management, such as OS handles and external connections/resources.</p>
        <h4>Why it exists</h4>

          <li>DB connections</li>
          <li>Network sockets</li>
          <li>OS handles</li>
        </ul>
        <p>Waiting for GC → <b>delayed release → resource leaks / limits hit</b>.</p>
        <h4>Most common: you consume it</h4>
        <p>You work with classes that already implement <code>IDisposable</code>: <code>StreamReader</code>, <code>SqlConnection</code>, <code>HttpClient</code> (with care). You just ensure <code>Dispose()</code> gets called.</p>
        ${cb('csharp', `using (var file = new StreamReader("file.txt"))
{
    // use file
} // Dispose() called automatically`)}
        <h4>Key difference — interview line</h4>
        <blockquote class="say"><p>GC handles managed memory automatically, while <code>IDisposable</code> is used to explicitly release unmanaged resources as soon as you're done with them.</p></blockquote>
        <h4>Common mistake</h4>
        <p>Assuming GC will close files/connections — it won't do it on time.</p>
        <h4>What GC actually tracks</h4>
        <ul>
          <li>Object references in memory</li>
          <li>Reachability (alive or not)</li>

        <p>That's it. It does <b>NOT</b> track:</p>

        <h4>Why GC can't reliably release them</h4>

      html: `
        <h4>Concurrency — concept</h4>
        <p><b>Handling multiple tasks at the same time (logically).</b></p>

          <li>Tasks may <b>interleave</b>, not necessarily run simultaneously</li>

        <h4>Where true parallelism happens</h4>

        <h4>Thread pool</h4>
        <p>A <b>pool of reusable worker threads</b> managed by .NET (ThreadPool / TPL). When a thread is released, it usually goes back to the thread pool.</p>
        <h4>Parallel.ForEach</h4>
        <p><code>Parallel.ForEach</code> uses multiple threads from the thread pool. On multi-core systems it achieves true parallelism, while on single-core systems it results in concurrency through context switching.</p>
        <h4>Task.WhenAll</h4>
        <h5>What</h5>
        <p>Runs multiple <b>async tasks concurrently</b> and waits for all.</p>
        ${cb('csharp', `await Task.WhenAll(task1, task2, task3);`)}

        <h5>Example — counter increment</h5>
        <p class="bad-line">Not thread-safe:</p>
        ${cb('csharp', `count++; // race condition`)}
        <p class="good-line">Thread-safe:</p>
        ${cb('csharp', `Interlocked.Increment(ref count);`)}

        <ul>
          <li>No two threads corrupt the value</li>
          <li>No lock needed → <b>very fast</b></li>

        <h5>Other common ops</h5>
        ${cb('csharp', `Interlocked.Decrement(ref count);
Interlocked.Add(ref total, 10);

        <ul>
          <li>Simple numeric updates</li>

  "exp": 1713779600,
  "roles": ["admin", "editor"],
  "scope": "read:users write:users",
  "jti": "d9f3a1b2-unique-id"
}`)}
        <p>Not encrypted. Anyone can Base64-decode it. The signature makes it tamper-proof, not secret.</p>
        <h4>Segment 3 — signature</h4>
        ${cb('text', `RSA_Sign( SHA256( base64url(header) + "." + base64url(payload) ), PRIVATE_KEY )`)}
        <p>If you change even one byte in header or payload, the signature won't match anymore. That's the entire security model.</p>
        <h4>The claims, one by one</h4>
        <p>The registered ones come from the spec; the rest you add yourself.</p>
        <table>
          <thead><tr><th>Claim</th><th>Name</th><th>What it is for</th></tr></thead>
          <tbody>
            <tr><td><code>iss</code></td><td>Issuer</td><td>Who minted the token. Your API checks this matches the auth server it trusts.</td></tr>
            <tr><td><code>sub</code></td><td>Subject</td><td>Who the token is about — the user id. This is what you read for "who is logged in".</td></tr>
            <tr><td><code>aud</code></td><td>Audience</td><td>Who the token is meant for. A token minted for another API should be rejected by yours.</td></tr>
            <tr><td><code>exp</code></td><td>Expiry</td><td>Unix time after which it is dead. Short on purpose — you cannot revoke early.</td></tr>
            <tr><td><code>iat</code></td><td>Issued at</td><td>When it was minted.</td></tr>
            <tr><td><code>nbf</code></td><td>Not before</td><td>Do not accept it before this time. Often absent.</td></tr>
            <tr><td><code>jti</code></td><td>JWT id</td><td>Unique id for this token. Useful if you keep a deny-list.</td></tr>
            <tr><td><code>roles</code></td><td>Custom</td><td>What the user <b>is</b> — drives <code>[Authorize(Roles = "admin")]</code>.</td></tr>
            <tr><td><code>scope</code></td><td>Custom</td><td>What the app was <b>granted</b> — drives policy checks like <code>RequireClaim("scope", "write:users")</code>.</td></tr>
          </tbody>
        </table>
        <h4>Roles versus scopes — the distinction they probe</h4>
        <ul>
          <li><b>Roles</b> describe the user. "This person is an admin."</li>
          <li><b>Scopes</b> describe the delegated permission. "This app may write users on their behalf."</li>
        </ul>
        <p>A user can be an admin while the app holding the token only has read scope. Both have to pass.</p>
        <h4>Three things people get wrong</h4>
        <ul class="bad">
          <li>Thinking it is encrypted. It is <b>signed</b>, not encrypted — never put anything secret in the payload.</li>
          <li>Putting large objects in it. Every request carries the whole token in a header.</li>
          <li>Making it long-lived because revocation is awkward. The fix is short expiry plus a refresh token.</li>
        </ul>`
    },
    {
      id: 'sec-signature-verify',
      title: 'How the signature is verified',
      html: `
        <p>Auth server does this when creating the token:</p>
        ${cb('text', `hash      = SHA256("header.payload")
signature = encrypt(hash, PRIVATE_KEY)`)}
        <p>Your API does this when verifying:</p>
        ${cb('text', `hash_from_signature = decrypt(signature, PUBLIC_KEY)
hash_from_data      = SHA256("header.payload")

equal? → valid
not equal? → rejected`)}
        <p>That's it. The public key <b>decrypts</b> the signature back into the original hash. Then it checks if that hash matches a fresh hash of the received data.</p>
        <p>If anyone touched the payload — the fresh hash changes — mismatch — rejected.</p>`
    },
    {
      id: 'sec-oauth-flows',
      title: 'OAuth 2.0 — how it actually works',
      html: `
        <p>OAuth 2.0 is an <b>authorization framework</b>, not an authentication protocol. It answers: <i>"Can app X access resource Y on behalf of user Z?"</i></p>
        <h4>Four actors</h4>
        <table>
          <thead><tr><th>Actor</th><th>Who it is</th></tr></thead>
          <tbody>
            <tr><td><b>Resource Owner</b></td><td>The user (you)</td></tr>
            <tr><td><b>Client</b></td><td>The app requesting access (mobile app, SPA, etc.)</td></tr>
            <tr><td><b>Authorization Server</b></td><td>Issues tokens (Auth0, Keycloak, Azure AD, Google)</td></tr>
            <tr><td><b>Resource Server</b></td><td>Your API — the thing being protected</td></tr>
          </tbody>
        </table>
        <h4>The most common flow: Authorization Code Flow</h4>
        <p>This is what happens when you click "Login with Google":</p>
        ${cb('text', `1. USER clicks "Login with Google" in your App

2. APP redirects user to Google's auth server:
   GET https://accounts.google.com/o/oauth2/auth
     ?client_id=YOUR_APP_ID
     &redirect_uri=https://yourapp.com/callback
     &response_type=code
     &scope=openid email profile
     &state=random_csrf_token

3. GOOGLE shows login page → user enters credentials

4. GOOGLE redirects back to your app with a one-time code:
   GET https://yourapp.com/callback?code=AUTHORIZATION_CODE&state=...

5. YOUR APP SERVER exchanges code for tokens (server-to-server, never in browser):
   POST https://accounts.google.com/o/oauth2/token
     client_id=...
     client_secret=...        ← app's secret, never exposed to browser
     code=AUTHORIZATION_CODE
     grant_type=authorization_code

6. GOOGLE responds with:
   {
     "access_token": "eyJhbGci...",   ← JWT, used to call APIs
     "id_token": "eyJhbGci...",       ← JWT with user identity (OpenID Connect)
     "refresh_token": "...",          ← opaque token to get new access tokens
     "expires_in": 3600
   }

7. YOUR APP calls Google APIs using the access_token:
   GET https://www.googleapis.com/userinfo/v2/me
   Authorization: Bearer eyJhbGci...`)}
        <p><b>The code is single-use and short-lived. Even if someone intercepts the redirect URL, the code is useless without the client_secret to exchange it.</b></p>
        <h4>Other flows</h4>
        <p><b>Client Credentials Flow</b> — machine to machine, no user involved:</p>
        ${cb('http', `POST /token
client_id=service-a
client_secret=...
grant_type=client_credentials
scope=read:orders

→ returns access_token directly`)}
        <p>Microservices calling other microservices use this.</p>
        <p><b>Refresh Token Flow</b> — silently get a new access token when the old one expires:</p>
        ${cb('http', `POST /token
grant_type=refresh_token
refresh_token=LONG_LIVED_OPAQUE_TOKEN

→ returns new access_token (short-lived)`)}`
    },
    {
      id: 'sec-dotnet-pipeline',
      title: 'UseAuthentication() and UseAuthorization() in .NET',
      html: `
        <p>This is the part most tutorials skip. Layer by layer.</p>
        <h4>First — the setup in Program.cs</h4>
        ${cb('csharp', `// 1. REGISTRATION (build phase) — wires up the services
builder.Services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme)
    .AddJwtBearer(options => {
        options.Authority = "https://auth.myapp.com";  // JWKS fetched from here
        options.TokenValidationParameters = new TokenValidationParameters {
            ValidateIssuer = true,
            ValidIssuer = "https://auth.myapp.com",
            ValidateAudience = true,
            ValidAudience = "api.myapp.com",
            ValidateLifetime = true,
            ValidateIssuerSigningKey = true,
            // If using Authority, the public key is auto-fetched from JWKS
        };
    });

builder.Services.AddAuthorization(options => {
    options.AddPolicy("AdminOnly", policy =>
        policy.RequireRole("admin"));
    options.AddPolicy("CanWriteUsers", policy =>
        policy.RequireClaim("scope", "write:users"));
});

// 2. PIPELINE (request phase) — order matters
app.UseAuthentication();  // runs first, identifies WHO you are
app.UseAuthorization();   // runs second, decides WHAT you can do`)}
        <p><b>TokenValidationParameters</b> → params on which the server validates the token.</p>
        <p><b>Scopes</b> → you usually mention on the top of the controller: <code>[Authorize("")]</code></p>
        <h4>What happens on every incoming request</h4>
        ${cb('text', `Request arrives
    |
    ▼
UseAuthentication()
  → reads Authorization: Bearer <token>
  → validates signature, exp, iss, aud
  → if valid   → builds ClaimsPrincipal → sets HttpContext.User (IsAuthenticated = true)
  → if invalid → sets HttpContext.User as anonymous (IsAuthenticated = false)
  → does NOT return 401 here, just identifies the user
    |
    ▼
UseAuthorization()
  → endpoint has [Authorize]?
      not authenticated → 401
      authenticated but wrong role/claim → 403
      authenticated + correct role/claim → pass
  → endpoint has [AllowAnonymous] → pass through
  → endpoint has nothing → pass through
    |
    ▼
Controller runs
  HttpContext.User is available with all claims`)}
        <p><b>Key point — authentication identifies you. Authorization decides what you can do.</b> That's why order matters: <code>UseAuthentication()</code> must come before <code>UseAuthorization()</code>.</p>`
    },
    {
      id: 'sec-scopes-roles',
      title: 'How scopes and roles are validated',
      html: `
        <p>For interviews, just know:</p>
        <ul>
          <li><b>ClaimsPrincipal</b> = the user object populated from JWT claims after authentication, so you can get the user context. <i>"How do you get the logged in user's ID in a controller?"</i> Answer: <code>User.FindFirst("sub")?.Value</code>. Done.</li>
          <li><code>User.IsInRole("admin")</code> checks the roles claim</li>
          <li><code>[Authorize(Roles = "admin")]</code> = only admin can access this endpoint</li>
          <li><code>[Authorize(Policy = "...")]</code> = more flexible, custom rules</li>
        </ul>
        <h4>Scopes</h4>
        ${cb('json', `"scope": "read:users write:users"`)}
        <p>Your API checks them either via policy or manually:</p>
        ${cb('csharp', `// Define policy at startup
builder.Services.AddAuthorization(options => {
    options.AddPolicy("CanWriteUsers", policy =>
        policy.RequireClaim("scope", "write:users"));
});

// Use it on endpoint
[Authorize(Policy = "CanWriteUsers")]
public IActionResult CreateUser() { ... }`)}
        <h4>Roles</h4>
        ${cb('csharp', `// Startup
builder.Services.AddAuthorization(options => {
    options.AddPolicy("AdminOnly", policy =>
        policy.RequireRole("admin"));
});

// On endpoint
[Authorize(Roles = "admin")]        // option 1 - direct
[Authorize(Policy = "AdminOnly")]   // option 2 - policy`)}`
    },
    {
      id: 'sec-stateless',
      title: 'Why this is secure without a DB call',
      html: `
        <p>Every request is validated <b>entirely in memory</b>:</p>
        <ul>
          <li>The signature check is pure crypto (no network call after initial JWKS cache)</li>
          <li>The claims check is just reading an in-memory object</li>
          <li>No session store, no DB lookup, no auth server call per request</li>
        </ul>
        <p>That's why JWT is stateless and scales horizontally — spin up 100 instances of your API and every one can validate any token independently, because they all have the same public key.</p>
        <p>The tradeoff: you <b>can't revoke</b> a JWT before it expires (since there's no central check). That's why access tokens are kept short-lived (5–15 min) and you pair them with refresh tokens.</p>`
    },
    {
      id: 'sec-jwt-microservices',
      title: 'JWT across microservices',
      html: `
        <h4>Case 1: client logs in to your own app, calls your microservices</h4>
        ${cb('text', `User logs in → your auth server issues JWT
Client sends JWT in every request
API Gateway validates JWT (signature + claims)
Forwards to microservice with user claims in headers
Microservice trusts gateway (or re-validates itself)`)}
        <h4>Case 2: login via third party (Google/Facebook)</h4>
        ${cb('text', `User logs in via Google → Google issues JWT
Your app exchanges it for YOUR OWN JWT
  (you verify Google's token, then mint your own)
Client uses YOUR JWT to call your microservices
If calling Google APIs → use Google's access_token separately`)}
        <p><b>Key point — you never pass Google's token to your own microservices. You issue your own.</b></p>`
    }
  ]
});

SECTIONS.push({
  id: 'patterns',
  title: 'Design patterns',
  kicker: 'Strategy, Factory, Facade',
  topics: [
    {
      id: 'pat-principle',
      title: 'How to pick a pattern',
      html: `
        <ul>
          <li>Patterns are <b>tools for expressing intent</b>, not rigid mechanical rules.</li>
          <li>At implementation level, many patterns can be shaped to look similar.</li>
          <li>The <b>decision should come from the problem you're solving</b>, not how the code looks.</li>
        </ul>
        <h4>Factory vs Strategy</h4>
        <ul>
          <li>"I need to control creation" → Factory</li>
          <li>"I need to vary behavior" → Strategy</li>
        </ul>
        <p>Ask "what is actually changing here — behavior or creation?" and you'll land on the right pattern almost every time without overthinking.</p>
        <table>
          <thead><tr><th>Decision / situation</th><th>Go with Strategy</th><th>Go with Factory</th></tr></thead>
          <tbody>
            <tr><td>Core problem</td><td>Multiple ways to perform the <b>same action</b></td><td>Need to <b>decide which object to create</b></td></tr>
            <tr><td>Focus</td><td><b>Behavior variation</b></td><td><b>Object creation</b></td></tr>
            <tr><td>When it applies</td><td>Logic/algorithm changes (e.g. payment methods, sorting)</td><td>Creation depends on input/config (e.g. notification type, parser type)</td></tr>
            <tr><td>Goal</td><td>Avoid <code>if-else</code> for behavior switching</td><td>Centralize and hide <code>new</code> object creation</td></tr>
          </tbody>
        </table>`
    },
    {
      id: 'pat-strategy',
      title: 'Strategy pattern — payment',
      html: `
        <p class="tagline">Behavioral design pattern</p>
        <h4>When to use</h4>
        <p>When you have <b>multiple ways to perform the same action</b> and want to switch between them cleanly.</p>
        <h4>Example — payment</h4>
        ${cb('csharp', `public interface IPaymentStrategy        // Strategy (Contract)
{
    void Pay(decimal amount);
}

public class UpiPayment : IPaymentStrategy      // Concrete Strategy
{
    public void Pay(decimal amount)
    {
        // UPI logic
    }
}

public class CardPayment : IPaymentStrategy     // Concrete Strategy
{
    public void Pay(decimal amount)
    {
        // Card logic
    }
}

public class PaymentProcessor            // Context
{
    private IPaymentStrategy _strategy;

    public void SetStrategy(IPaymentStrategy strategy)
    {
        _strategy = strategy;
    }

    public void Process(decimal amount)
    {
        _strategy.Pay(amount);
    }
}`)}
        <p>Client:</p>
        ${cb('csharp', `var processor = new PaymentProcessor();

processor.SetStrategy(new UpiPayment());
processor.Process(100);

processor.SetStrategy(new CardPayment());
processor.Process(200);`)}
        <h4>Why Strategy here</h4>
        <ul>
          <li>Payment = <b>same action (Pay)</b></li>
          <li>Different ways = <b>UPI, Card, etc.</b></li>
          <li>You want to switch behavior <b>without if-else clutter</b></li>
        </ul>
        <p>That's why Strategy fits — it models <b>multiple ways to perform the same action</b>.</p>`
    },
    {
      id: 'pat-factory',
      title: 'Factory pattern — notification',
      html: `
        <p class="tagline">Creational design pattern</p>
        <h4>When to use</h4>
        <p>When you need to <b>decide which object to create</b> based on input/config.</p>
        <h4>Example — notification</h4>
        ${cb('csharp', `public interface INotification           // Product (Contract)
{
    void Send(string message);
}

public class EmailNotification : INotification    // Concrete Product
{
    public void Send(string message)
    {
        // email logic
    }
}

public class SmsNotification : INotification      // Concrete Product
{
    public void Send(string message)
    {
        // sms logic
    }
}

public static class NotificationFactory   // Factory (Creator)
{
    public static INotification Create(string type)
    {
        return type switch
        {
            "email" => new EmailNotification(),
            "sms" => new SmsNotification(),
            _ => throw new ArgumentException("Invalid type")
        };
    }
}`)}
        <p>Client:</p>
        ${cb('csharp', `var notification = NotificationFactory.Create("email");
notification.Send("Hello");`)}
        <h4>Why Factory here</h4>
        <ul>
          <li>Problem = <b>which notification object to create</b></li>
          <li>Not multiple behaviors of the same action</li>
          <li>Just selecting the correct object</li>
        </ul>
        <p>That's why Factory fits — it handles <b>object creation, not behavior variation</b>.</p>`
    },
    {
      id: 'pat-facade',
      title: 'Facade — CivitBIM APIs',
      html: `
        <ul>
          <li><b>Type</b> → Structural pattern</li>
          <li><b>Intent</b> → Provide a <b>simple interface over a complex subsystem</b></li>
          <li><b>When used</b> → When a system has too many internal components and you want to <b>hide complexity from the client</b></li>
        </ul>`
    }
  ]
});

          <li>Must be <b>shorter than the upstream timeout</b> (avoid chain delays)</li>

        <h4>Retry</h4>
        <ul>
          <li>Handles <b>transient failures</b> (network glitches, 5xx)</li>
          <li>Keep retries <b>low (2–3 max)</b> to avoid overload</li>
        </ul>
        <h4>Circuit breaker</h4>
        <ul>
          <li>Stops hitting a <b>failing service repeatedly</b></li>
          <li>System <b>fails fast instead of wasting resources</b></li>
        </ul>

          <li>Timeout applied (2s max wait)</li>
          <li>If fails → retry (2 times)</li>
          <li>If still failing → circuit opens</li>
          <li>Next calls → fail immediately</li>
        </ol>
        <p>Result:</p>
        <ul>
          <li>No thread exhaustion</li>
          <li>No cascading failure</li>
          <li>Graceful degradation</li>

        <p>Service discovery is how one service <b>finds the network location (IP/port) of another service dynamically</b>, instead of hardcoding URLs like:</p>
        ${cb('csharp', `"https://paymentservice"`)}
        <p>Because in real systems:</p>
        <ul>
          <li>services scale up/down</li>
          <li>instances change IPs</li>
          <li>containers restart</li>
        </ul>
        <p>Hardcoding = fragile.</p>
        <h4>Server-side discovery — more common in real systems</h4>
        <p>Flow:</p>
        <ol>
          <li>Call goes to gateway / load balancer</li>
          <li>It resolves the actual service instance</li>
          <li>Routes the request</li>
        </ol>
        <p>Examples:</p>
        <ul>
          <li>Kubernetes (via DNS like <code>payment-service.default.svc.cluster.local</code>)</li>
          <li>API Gateway like Ocelot</li>
        </ul>
        <h4>Where .NET fits in</h4>
        <p>Your .NET app just <b>calls by service name</b>, not IP.</p>
        <p class="filepath">Program.cs</p>
        ${cb('csharp', `services.AddHttpClient("PaymentService", client =>
{
    client.BaseAddress = new Uri("http://payment-service");
});`)}
        <p>That's it. No registration code. No registry calls.</p>
        <p>Kubernetes resolves:</p>
        ${cb('text', `payment-service → actual pod IPs`)}
        <h4>Without service discovery</h4>
        <ul>
          <li>Scaling breaks your system</li>
          <li>Deployments require code changes</li>
          <li>No fault tolerance</li>
        </ul>
        <h4>With it</h4>
        <ul>
          <li>Services are <b>loosely coupled</b></li>
